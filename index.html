<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07090f">
  <title>Награждение</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #06070b;
      --card: rgba(255,255,255,.055);
      --border: rgba(255,255,255,.09);
      --text: #f7f7f8;
      --muted: #9298a6;
      --gold: #f6c453;
      --gold2: #ffdf8a;
      --danger: #ff5b6e;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
      Roboto, Arial, sans-serif;
      background:
        radial-gradient(circle at 50% -10%, rgba(246,196,83,.14), transparent 30%),
        radial-gradient(circle at 100% 30%, rgba(107,80,255,.08), transparent 30%),
        #06070b;
      color: var(--text);
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* ================= HEADER ================= */

    header {
      width: 100%;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 7%;
      border-bottom: 1px solid rgba(255,255,255,.06);
      background: rgba(6,7,11,.72);
      backdrop-filter: blur(18px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 13px;
      font-weight: 800;
      letter-spacing: -.4px;
      font-size: 19px;
    }

    .logo-icon {
      width: 39px;
      height: 39px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: #111;
      font-size: 19px;
      background:
        linear-gradient(135deg, #fff2ba, #e9a92f);
      box-shadow: 0 8px 25px rgba(246,196,83,.18);
    }

    .admin-open {
      border: 1px solid rgba(255,255,255,.09);
      color: #a5aab5;
      background: rgba(255,255,255,.04);
      padding: 10px 15px;
      border-radius: 12px;
      transition: .25s;
    }

    .admin-open:hover {
      color: white;
      border-color: rgba(255,255,255,.2);
    }

    /* ================= HERO ================= */

    .hero {
      padding: 78px 20px 42px;
      text-align: center;
    }

    .hero-medal {
      width: 72px;
      height: 72px;
      margin: 0 auto 25px;
      border-radius: 24px;
      display: grid;
      place-items: center;
      font-size: 34px;
      background:
        linear-gradient(145deg, rgba(255,226,144,.18), rgba(255,180,45,.06));
      border: 1px solid rgba(255,215,120,.2);
      box-shadow:
        0 20px 60px rgba(255,187,45,.1),
        inset 0 0 30px rgba(255,220,130,.05);
    }

    .hero h1 {
      font-size: clamp(40px, 7vw, 76px);
      letter-spacing: -3px;
      line-height: .95;
      font-weight: 850;
      background: linear-gradient(180deg, #fff, #aeb1b8);
      -webkit-background-clip: text;
      color: transparent;
    }

    .hero p {
      margin-top: 20px;
      color: var(--muted);
      font-size: 16px;
    }

    /* ================= LIST ================= */

    .ranking {
      width: min(900px, calc(100% - 32px));
      margin: 20px auto 100px;
    }

    .person-card {
      position: relative;
      display: flex;
      align-items: center;
      gap: 19px;
      width: 100%;
      min-height: 104px;
      margin-bottom: 13px;
      padding: 15px 22px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 23px;
      cursor: pointer;
      transition:
        transform .25s ease,
        border-color .25s ease,
        background .25s ease;
      overflow: hidden;
    }

    .person-card:hover {
      transform: translateY(-3px);
      border-color: rgba(255,255,255,.17);
      background: rgba(255,255,255,.075);
    }

    .person-card.first {
      background:
        linear-gradient(100deg,
        rgba(246,196,83,.13),
        rgba(255,255,255,.04));
      border-color: rgba(246,196,83,.27);
    }

    .person-card.second {
      background:
        linear-gradient(100deg,
        rgba(190,199,216,.09),
        rgba(255,255,255,.035));
    }

    .person-card.third {
      background:
        linear-gradient(100deg,
        rgba(194,125,71,.09),
        rgba(255,255,255,.035));
    }

    .place {
      width: 60px;
      flex-shrink: 0;
      text-align: center;
    }

    .place-number {
      font-size: 25px;
      font-weight: 850;
      letter-spacing: -1px;
    }

    .first .place-number {
      color: #ffd96c;
    }

    .second .place-number {
      color: #d7dce5;
    }

    .third .place-number {
      color: #d59669;
    }

    .place-text {
      display: block;
      margin-top: 2px;
      color: #777d89;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .avatar {
      width: 68px;
      height: 68px;
      border-radius: 19px;
      object-fit: cover;
      background: #15171d;
      border: 1px solid rgba(255,255,255,.1);
      flex-shrink: 0;
    }

    .avatar-placeholder {
      width: 68px;
      height: 68px;
      border-radius: 19px;
      display: grid;
      place-items: center;
      background: #12141a;
      color: #555b67;
      font-size: 24px;
      flex-shrink: 0;
    }

    .person-info {
      flex: 1;
      min-width: 0;
    }

    .person-name {
      font-size: 19px;
      font-weight: 720;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .person-sub {
      margin-top: 6px;
      color: #777d88;
      font-size: 13px;
    }

    .arrow {
      width: 37px;
      height: 37px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #858a95;
      background: rgba(255,255,255,.045);
      font-size: 18px;
      transition: .2s;
    }

    .person-card:hover .arrow {
      transform: translateX(3px);
      color: white;
    }

    .empty {
      text-align: center;
      padding: 80px 20px;
      color: #6f7480;
    }

    .empty-icon {
      font-size: 45px;
      margin-bottom: 15px;
    }

    /* ================= PERSON PAGE ================= */

    .person-page {
      position: fixed;
      inset: 0;
      z-index: 500;
      overflow-y: auto;
      background:
        radial-gradient(circle at 50% 0%, rgba(246,196,83,.18), transparent 30%),
        #06070b;
      opacity: 0;
      visibility: hidden;
      transform: scale(1.02);
      transition: .35s;
    }

    .person-page.active {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
    }

    .back-button {
      position: fixed;
      left: 25px;
      top: 24px;
      z-index: 530;
      height: 46px;
      padding: 0 18px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.1);
      color: white;
      background: rgba(15,16,21,.75);
      backdrop-filter: blur(15px);
    }

    .profile-container {
      width: min(760px, calc(100% - 30px));
      margin: 0 auto;
      padding: 100px 0 80px;
      text-align: center;
      position: relative;
      z-index: 510;
    }

    .big-place {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 22px;
      padding: 9px 16px;
      border-radius: 100px;
      color: #f8d77d;
      background: rgba(246,196,83,.1);
      border: 1px solid rgba(246,196,83,.2);
      font-size: 14px;
      font-weight: 700;
    }

    .big-photo {
      width: 230px;
      height: 230px;
      border-radius: 42px;
      object-fit: cover;
      background: #111318;
      border: 1px solid rgba(255,255,255,.13);
      box-shadow:
        0 30px 80px rgba(0,0,0,.5),
        0 0 70px rgba(246,196,83,.07);
    }

    .big-placeholder {
      width: 230px;
      height: 230px;
      margin: auto;
      border-radius: 42px;
      display: grid;
      place-items: center;
      font-size: 70px;
      color: #4e535e;
      background: #111318;
      border: 1px solid rgba(255,255,255,.1);
    }

    .profile-name {
      margin-top: 28px;
      font-size: clamp(29px, 6vw, 48px);
      line-height: 1.08;
      letter-spacing: -1.7px;
    }

    .certificate-title {
      margin: 70px 0 20px;
      color: #9297a2;
      text-transform: uppercase;
      letter-spacing: 2.5px;
      font-size: 12px;
      font-weight: 700;
    }

    .diploma {
      width: 100%;
      max-height: 900px;
      object-fit: contain;
      border-radius: 24px;
      background: white;
      box-shadow: 0 35px 100px rgba(0,0,0,.45);
      cursor: zoom-in;
    }

    .no-diploma {
      padding: 80px 20px;
      border: 1px dashed rgba(255,255,255,.1);
      border-radius: 24px;
      color: #686e79;
    }

    /* ================= FIREWORKS ================= */

    #fireworks {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 505;
      pointer-events: none;
    }

    /* ================= ADMIN ================= */

    .admin {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: #08090d;
      overflow-y: auto;
      display: none;
    }

    .admin.active {
      display: block;
    }

    .admin-header {
      height: 75px;
      padding: 0 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,.07);
      background: rgba(8,9,13,.9);
      backdrop-filter: blur(20px);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .admin-header h2 {
      font-size: 19px;
    }

    .close-admin {
      border: 0;
      background: #17191f;
      color: #bbbfc7;
      padding: 10px 16px;
      border-radius: 11px;
    }

    .admin-content {
      width: min(1000px, calc(100% - 30px));
      margin: 40px auto 80px;
    }

    .admin-grid {
      display: grid;
      grid-template-columns: 370px 1fr;
      gap: 25px;
    }

    .panel {
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.035);
      border-radius: 22px;
      padding: 25px;
    }

    .panel h3 {
      font-size: 18px;
      margin-bottom: 22px;
    }

    label {
      display: block;
      margin: 17px 0 8px;
      font-size: 12px;
      color: #9297a2;
    }

    input {
      width: 100%;
      height: 47px;
      padding: 0 14px;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 12px;
      background: #101217;
      color: white;
      outline: none;
    }

    input:focus {
      border-color: rgba(246,196,83,.45);
    }

    input[type="file"] {
      height: auto;
      padding: 13px;
      color: #9297a2;
    }

    .save-button {
      width: 100%;
      height: 49px;
      margin-top: 23px;
      border: 0;
      border-radius: 13px;
      color: #15110a;
      font-weight: 800;
      background: linear-gradient(135deg, #ffe49a, #eeb23d);
    }

    .admin-person {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 13px;
      margin-bottom: 9px;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 15px;
      background: rgba(255,255,255,.025);
    }

    .admin-place {
      width: 37px;
      color: #e9bf5d;
      font-weight: 800;
    }

    .admin-person-name {
      flex: 1;
      font-size: 14px;
    }

    .edit-btn,
    .delete-btn {
      border: 0;
      border-radius: 9px;
      padding: 8px 10px;
    }

    .edit-btn {
      color: #d5d8df;
      background: #20232b;
    }

    .delete-btn {
      color: #ff8895;
      background: rgba(255,91,110,.1);
    }

    /* ================= LOGIN ================= */

    .login {
      position: fixed;
      inset: 0;
      z-index: 1200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0,0,0,.75);
      backdrop-filter: blur(15px);
    }

    .login.active {
      display: flex;
    }

    .login-box {
      width: min(390px, 100%);
      padding: 32px;
      border-radius: 25px;
      background: #101116;
      border: 1px solid rgba(255,255,255,.1);
      box-shadow: 0 30px 100px rgba(0,0,0,.5);
    }

    .login-icon {
      width: 55px;
      height: 55px;
      display: grid;
      place-items: center;
      margin-bottom: 20px;
      border-radius: 17px;
      background: rgba(246,196,83,.1);
      font-size: 25px;
    }

    .login-box h2 {
      font-size: 24px;
    }

    .login-box p {
      color: #7f8490;
      margin: 8px 0 20px;
      font-size: 14px;
    }

    .login-error {
      color: #ff7484;
      font-size: 13px;
      margin-top: 10px;
      display: none;
    }

    .login-buttons {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .login-buttons button {
      flex: 1;
      height: 45px;
      border-radius: 12px;
    }

    .cancel {
      border: 1px solid rgba(255,255,255,.09);
      color: #aaaeb8;
      background: transparent;
    }

    .enter {
      border: 0;
      font-weight: 750;
      color: #17130b;
      background: linear-gradient(135deg,#ffe39a,#eab03d);
    }

    /* ================= IMAGE VIEWER ================= */

    .viewer {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0,0,0,.94);
      cursor: zoom-out;
    }

    .viewer.active {
      display: flex;
    }

    .viewer img {
      max-width: 96%;
      max-height: 94vh;
      object-fit: contain;
    }

    /* ================= RESPONSIVE ================= */

    @media(max-width: 750px) {
      header {
        height: 68px;
        padding: 0 18px;
      }

      .logo {
        font-size: 16px;
      }

      .logo-icon {
        width: 35px;
        height: 35px;
      }

      .admin-open {
        font-size: 12px;
        padding: 9px 12px;
      }

      .hero {
        padding-top: 52px;
      }

      .hero h1 {
        letter-spacing: -2px;
      }

      .ranking {
        width: calc(100% - 20px);
      }

      .person-card {
        min-height: 88px;
        padding: 11px 13px;
        gap: 11px;
        border-radius: 18px;
      }

      .place {
        width: 42px;
      }

      .place-number {
        font-size: 21px;
      }

      .avatar,
      .avatar-placeholder {
        width: 57px;
        height: 57px;
        border-radius: 15px;
      }

      .person-name {
        font-size: 15px;
      }

      .person-sub {
        font-size: 11px;
      }

      .arrow {
        width: 31px;
        height: 31px;
      }

      .admin-grid {
        grid-template-columns: 1fr;
      }

      .panel {
        padding: 19px;
      }

      .back-button {
        top: 15px;
        left: 15px;
      }

      .profile-container {
        padding-top: 90px;
      }

      .big-photo,
      .big-placeholder {
        width: 190px;
        height: 190px;
        border-radius: 34px;
      }

      .certificate-title {
        margin-top: 50px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">
    <div class="logo-icon">✦</div>
    <span>Награждение</span>
  </div>

  <button class="admin-open" onclick="showLogin()">
    Управление
  </button>
</header>

<section class="hero">
  <div class="hero-medal">🏆</div>

  <h1>Награждение</h1>

  <p>Торжественный список участников</p>
</section>

<main class="ranking" id="ranking"></main>

<!-- PERSON PAGE -->

<section class="person-page" id="personPage">

  <canvas id="fireworks"></canvas>

  <button class="back-button" onclick="closePerson()">
    ← Назад
  </button>

  <div class="profile-container">

    <div class="big-place" id="profilePlace">
      🏆 1 место
    </div>

    <div id="profilePhoto"></div>

    <h1 class="profile-name" id="profileName"></h1>

    <div class="certificate-title">
      Диплом
    </div>

    <div id="profileDiploma"></div>

  </div>

</section>

<!-- LOGIN -->

<div class="login" id="login">

  <div class="login-box">

    <div class="login-icon">🔐</div>

    <h2>Вход</h2>

    <p>Введите пароль для доступа к управлению.</p>

    <input
      type="password"
      id="password"
      placeholder="Пароль"
      onkeydown="if(event.key === 'Enter') loginAdmin()"
    >

    <div class="login-error" id="loginError">
      Неверный пароль
    </div>

    <div class="login-buttons">

      <button class="cancel" onclick="hideLogin()">
        Отмена
      </button>

      <button class="enter" onclick="loginAdmin()">
        Войти
      </button>

    </div>

  </div>

</div>

<!-- ADMIN -->

<section class="admin" id="admin">

  <div class="admin-header">

    <h2>Управление</h2>

    <button class="close-admin" onclick="closeAdmin()">
      Закрыть
    </button>

  </div>

  <div class="admin-content">

    <div class="admin-grid">

      <div class="panel">

        <h3 id="formTitle">
          Добавить участника
        </h3>

        <label>Место</label>

        <input
          type="number"
          id="placeInput"
          min="1"
          placeholder="Например: 1"
        >

        <label>Имя и фамилия</label>

        <input
          type="text"
          id="nameInput"
          placeholder="Имя Фамилия"
        >

        <label>Фотография</label>

        <input
          type="file"
          id="photoInput"
          accept="image/*"
        >

        <label>Фото диплома</label>

        <input
          type="file"
          id="diplomaInput"
          accept="image/*"
        >

        <button class="save-button" onclick="savePerson()">
          Сохранить
        </button>

      </div>

      <div class="panel">

        <h3>Список</h3>

        <div id="adminList"></div>

      </div>

    </div>

  </div>

</section>

<!-- IMAGE VIEWER -->

<div class="viewer" id="viewer" onclick="closeViewer()">
  <img id="viewerImage">
</div>

<script>
  const STORAGE_KEY = "award_people_v1";

  let people = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

  let editingId = null;
  let fireworksAnimation = null;

  /* =========================
     STORAGE
  ========================= */

  function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(people));
  }

  /* =========================
     IMAGE CONVERSION
  ========================= */

  function fileToDataURL(file) {
    return new Promise((resolve, reject) => {

      if (!file) {
        resolve(null);
        return;
      }

      const reader = new FileReader();

      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;

      reader.readAsDataURL(file);
    });
  }

  /* =========================
     RENDER MAIN
  ========================= */

  function renderRanking() {

    const ranking = document.getElementById("ranking");

    ranking.innerHTML = "";

    const sorted = [...people].sort(
      (a, b) => Number(a.place) - Number(b.place)
    );

    if (sorted.length === 0) {

      ranking.innerHTML = `
        <div class="empty">
          <div class="empty-icon">✦</div>
          Список пока пуст
        </div>
      `;

      return;
    }

    sorted.forEach(person => {

      const card = document.createElement("div");

      let className = "";

      if (Number(person.place) === 1) className = "first";
      if (Number(person.place) === 2) className = "second";
      if (Number(person.place) === 3) className = "third";

      card.className = `person-card ${className}`;

      card.onclick = () => openPerson(person.id);

      const photo = person.photo
        ? `<img class="avatar" src="${person.photo}">`
        : `<div class="avatar-placeholder">✦</div>`;

      card.innerHTML = `

        <div class="place">

          <div class="place-number">
            ${person.place}
          </div>

          <span class="place-text">
            место
          </span>

        </div>

        ${photo}

        <div class="person-info">

          <div class="person-name">
            ${escapeHTML(person.name)}
          </div>

          <div class="person-sub">
            Посмотреть награду
          </div>

        </div>

        <div class="arrow">
          ›
        </div>
      `;

      ranking.appendChild(card);
    });
  }

  /* =========================
     PERSON
  ========================= */

  function openPerson(id) {

    const person = people.find(p => p.id === id);

    if (!person) return;

    document.getElementById("profileName").textContent =
      person.name;

    document.getElementById("profilePlace").innerHTML =
      `🏆 ${person.place} место`;

    const photoContainer =
      document.getElementById("profilePhoto");

    if (person.photo) {

      photoContainer.innerHTML =
        `<img class="big-photo" src="${person.photo}">`;

    } else {

      photoContainer.innerHTML =
        `<div class="big-placeholder">✦</div>`;
    }

    const diplomaContainer =
      document.getElementById("profileDiploma");

    if (person.diploma) {

      diplomaContainer.innerHTML = `
        <img
          class="diploma"
          src="${person.diploma}"
          onclick="openViewer('${person.id}')"
        >
      `;

    } else {

      diplomaContainer.innerHTML =
        `<div class="no-diploma">Диплом не добавлен</div>`;
    }

    document
      .getElementById("personPage")
      .classList.add("active");

    document.body.style.overflow = "hidden";

    startFireworks();
  }

  function closePerson() {

    document
      .getElementById("personPage")
      .classList.remove("active");

    document.body.style.overflow = "";

    stopFireworks();
  }

  /* =========================
     DIPLOMA VIEWER
  ========================= */

  function openViewer(id) {

    const person = people.find(p => p.id === id);

    if (!person || !person.diploma) return;

    document.getElementById("viewerImage").src =
      person.diploma;

    document
      .getElementById("viewer")
      .classList.add("active");
  }

  function closeViewer() {

    document
      .getElementById("viewer")
      .classList.remove("active");
  }

  /* =========================
     LOGIN
  ========================= */

  function showLogin() {

    document
      .getElementById("login")
      .classList.add("active");

    setTimeout(() => {
      document.getElementById("password").focus();
    }, 100);
  }

  function hideLogin() {

    document
      .getElementById("login")
      .classList.remove("active");

    document.getElementById("password").value = "";

    document.getElementById("loginError").style.display =
      "none";
  }

  function loginAdmin() {

    const password =
      document.getElementById("password").value;

    if (password === "123321") {

      hideLogin();

      document
        .getElementById("admin")
        .classList.add("active");

      renderAdmin();

      document.body.style.overflow = "hidden";

    } else {

      document.getElementById("loginError").style.display =
        "block";
    }
  }

  function closeAdmin() {

    document
      .getElementById("admin")
      .classList.remove("active");

    document.body.style.overflow = "";

    resetForm();
  }

  /* =========================
     ADMIN SAVE
  ========================= */

  async function savePerson() {

    const place =
      document.getElementById("placeInput").value.trim();

    const name =
      document.getElementById("nameInput").value.trim();

    const photoFile =
      document.getElementById("photoInput").files[0];

    const diplomaFile =
      document.getElementById("diplomaInput").files[0];

    if (!place || !name) {

      alert("Введите место и имя");

      return;
    }

    if (Number(place) < 1) {

      alert("Место должно быть от 1 и выше");

      return;
    }

    const samePlace = people.find(
      p =>
        Number(p.place) === Number(place) &&
        p.id !== editingId
    );

    if (samePlace) {

      alert("Это место уже занято");

      return;
    }

    let photo = null;
    let diploma = null;

    try {

      photo = await fileToDataURL(photoFile);
      diploma = await fileToDataURL(diplomaFile);

    } catch (e) {

      alert("Не удалось загрузить изображение");

      return;
    }

    if (editingId) {

      const person =
        people.find(p => p.id === editingId);

      if (!person) return;

      person.place = Number(place);
      person.name = name;

      if (photo) {
        person.photo = photo;
      }

      if (diploma) {
        person.diploma = diploma;
      }

    } else {

      people.push({

        id:
          Date.now().toString() +
          Math.random().toString(16).slice(2),

        place: Number(place),

        name: name,

        photo: photo,

        diploma: diploma
      });
    }

    saveData();

    resetForm();

    renderRanking();

    renderAdmin();
  }

  /* =========================
     ADMIN LIST
  ========================= */

  function renderAdmin() {

    const list =
      document.getElementById("adminList");

    list.innerHTML = "";

    const sorted =
      [...people].sort(
        (a, b) => Number(a.place) - Number(b.place)
      );

    if (sorted.length === 0) {

      list.innerHTML =
        `<div style="color:#737985">Список пуст</div>`;

      return;
    }

    sorted.forEach(person => {

      const item =
        document.createElement("div");

      item.className = "admin-person";

      item.innerHTML = `

        <div class="admin-place">
          #${person.place}
        </div>

        <div class="admin-person-name">
          ${escapeHTML(person.name)}
        </div>

        <button
          class="edit-btn"
          onclick="editPerson('${person.id}')"
        >
          Изменить
        </button>

        <button
          class="delete-btn"
          onclick="deletePerson('${person.id}')"
        >
          ×
        </button>
      `;

      list.appendChild(item);
    });
  }

  function editPerson(id) {

    const person =
      people.find(p => p.id === id);

    if (!person) return;

    editingId = id;

    document.getElementById("formTitle").textContent =
      "Изменить участника";

    document.getElementById("placeInput").value =
      person.place;

    document.getElementById("nameInput").value =
      person.name;

    document
      .querySelector(".admin")
      .scrollTo({
        top: 0,
        behavior: "smooth"
      });
  }

  function deletePerson(id) {

    const person =
      people.find(p => p.id === id);

    if (!person) return;

    if (!confirm(`Удалить ${person.name}?`)) {
      return;
    }

    people =
      people.filter(p => p.id !== id);

    saveData();

    renderRanking();

    renderAdmin();

    if (editingId === id) {
      resetForm();
    }
  }

  function resetForm() {

    editingId = null;

    document.getElementById("formTitle").textContent =
      "Добавить участника";

    document.getElementById("placeInput").value = "";
    document.getElementById("nameInput").value = "";
    document.getElementById("photoInput").value = "";
    document.getElementById("diplomaInput").value = "";
  }

  /* =========================
     FIREWORKS
  ========================= */

  function startFireworks() {

    const canvas =
      document.getElementById("fireworks");

    const ctx =
      canvas.getContext("2d");

    let width;
    let height;

    let particles = [];
    let rockets = [];

    function resize() {

      width = canvas.width =
        window.innerWidth * devicePixelRatio;

      height = canvas.height =
        window.innerHeight * devicePixelRatio;

      canvas.style.width =
        window.innerWidth + "px";

      canvas.style.height =
        window.innerHeight + "px";

      ctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
      );

      width = window.innerWidth;
      height = window.innerHeight;
    }

    resize();

    window.addEventListener("resize", resize);

    const colors = [
      "#ffd76a",
      "#ffffff",
      "#ff8a65",
      "#82b1ff",
      "#e99cff",
      "#7dffb2"
    ];

    function createExplosion(x, y) {

      const count =
        45 + Math.floor(Math.random() * 35);

      const color =
        colors[Math.floor(Math.random() * colors.length)];

      for (let i = 0; i < count; i++) {

        const angle =
          Math.random() * Math.PI * 2;

        const speed =
          1.5 + Math.random() * 5;

        particles.push({

          x,
          y,

          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,

          life: 1,

          decay:
            .012 + Math.random() * .013,

          size:
            1 + Math.random() * 2.3,

          color
        });
      }
    }

    function createRocket() {

      rockets.push({

        x:
          width * (.12 + Math.random() * .76),

        y:
          height + 20,

        targetY:
          height * (.12 + Math.random() * .45),

        speed:
          7 + Math.random() * 4,

        trail: []
      });
    }

    function animate() {

      ctx.clearRect(
        0,
        0,
        width,
        height
      );

      rockets.forEach((r, index) => {

        r.trail.push({
          x: r.x,
          y: r.y,
          life: 1
        });

        if (r.trail.length > 13) {
          r.trail.shift();
        }

        r.trail.forEach((t, i) => {

          ctx.beginPath();

          ctx.arc(
            t.x,
            t.y,
            1.5,
            0,
            Math.PI * 2
          );

          ctx.fillStyle =
            `rgba(255,220,130,${i / r.trail.length})`;

          ctx.fill();
        });

        r.y -= r.speed;

        ctx.beginPath();

        ctx.arc(
          r.x,
          r.y,
          2.5,
          0,
          Math.PI * 2
        );

        ctx.fillStyle = "#fff4bd";

        ctx.fill();

        if (r.y <= r.targetY) {

          createExplosion(
            r.x,
            r.y
          );

          rockets.splice(index, 1);
        }
      });

      particles.forEach((p, index) => {

        p.x += p.vx;
        p.y += p.vy;

        p.vy += .045;

        p.vx *= .992;

        p.life -= p.decay;

        ctx.globalAlpha =
          Math.max(p.life, 0);

        ctx.beginPath();

        ctx.arc(
          p.x,
          p.y,
          p.size,
          0,
          Math.PI * 2
        );

        ctx.fillStyle =
          p.color;

        ctx.fill();

        if (p.life <= 0) {
          particles.splice(index, 1);
        }
      });

      ctx.globalAlpha = 1;

      if (
        Math.random() < .035 &&
        rockets.length < 5
      ) {
        createRocket();
      }

      fireworksAnimation =
        requestAnimationFrame(animate);
    }

    createRocket();

    setTimeout(createRocket, 250);
    setTimeout(createRocket, 500);

    animate();
  }

  function stopFireworks() {

    if (fireworksAnimation) {

      cancelAnimationFrame(
        fireworksAnimation
      );

      fireworksAnimation = null;
    }

    const canvas =
      document.getElementById("fireworks");

    const ctx =
      canvas.getContext("2d");

    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );
  }

  /* =========================
     SECURITY FOR TEXT
  ========================= */

  function escapeHTML(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  /* =========================
     START
  ========================= */

  renderRanking();

</script>
