<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#06070b">

  <title>Награждение</title>

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #06070b;
      --card: rgba(255,255,255,.055);
      --border: rgba(255,255,255,.09);
      --text: #f7f7f8;
      --muted: #9298a6;
      --gold: #f6c453;
      --gold2: #ffdf8a;
      --danger: #ff5b6e;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(246,196,83,.14),
          transparent 30%
        ),
        radial-gradient(
          circle at 100% 30%,
          rgba(107,80,255,.08),
          transparent 30%
        ),
        #06070b;

      color: var(--text);

      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      width: 100%;
      height: 80px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 7%;

      border-bottom: 1px solid rgba(255,255,255,.06);

      background: rgba(6,7,11,.72);

      backdrop-filter: blur(18px);

      position: sticky;
      top: 0;

      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;

      gap: 13px;

      font-weight: 800;

      letter-spacing: -.4px;

      font-size: 19px;
    }

    .logo-icon {
      width: 39px;
      height: 39px;

      border-radius: 12px;

      display: grid;
      place-items: center;

      color: #111;

      font-size: 19px;

      background:
        linear-gradient(
          135deg,
          #fff2ba,
          #e9a92f
        );

      box-shadow:
        0 8px 25px rgba(246,196,83,.18);
    }

    .admin-open {
      border: 1px solid rgba(255,255,255,.09);

      color: #a5aab5;

      background: rgba(255,255,255,.04);

      padding: 10px 15px;

      border-radius: 12px;

      transition: .25s;
    }

    .admin-open:hover {
      color: white;

      border-color: rgba(255,255,255,.2);
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      padding: 78px 20px 42px;

      text-align: center;
    }

    .hero-medal {
      width: 72px;
      height: 72px;

      margin: 0 auto 25px;

      border-radius: 24px;

      display: grid;
      place-items: center;

      font-size: 34px;

      background:
        linear-gradient(
          145deg,
          rgba(255,226,144,.18),
          rgba(255,180,45,.06)
        );

      border:
        1px solid rgba(255,215,120,.2);

      box-shadow:
        0 20px 60px rgba(255,187,45,.1),
        inset 0 0 30px rgba(255,220,130,.05);
    }

    .hero h1 {
      font-size: clamp(40px, 7vw, 76px);

      letter-spacing: -3px;

      line-height: .95;

      font-weight: 850;

      background:
        linear-gradient(
          180deg,
          #fff,
          #aeb1b8
        );

      -webkit-background-clip: text;

      color: transparent;
    }

    .hero p {
      margin-top: 20px;

      color: var(--muted);

      font-size: 16px;
    }

    /* =========================
       STATUS
    ========================= */

    .status {
      width: min(900px, calc(100% - 32px));

      margin: 10px auto 20px;

      display: none;

      padding: 14px 17px;

      border-radius: 14px;

      font-size: 13px;
    }

    .status.error {
      display: block;

      color: #ff98a4;

      border:
        1px solid rgba(255,91,110,.2);

      background:
        rgba(255,91,110,.08);
    }

    /* =========================
       LOADING
    ========================= */

    .loading {
      text-align: center;

      padding: 70px 20px;

      color: #777d88;
    }

    .spinner {
      width: 34px;
      height: 34px;

      margin: 0 auto 15px;

      border-radius: 50%;

      border:
        3px solid rgba(255,255,255,.08);

      border-top-color: #f6c453;

      animation:
        spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================
       RANKING
    ========================= */

    .ranking {
      width:
        min(900px, calc(100% - 32px));

      margin:
        20px auto 100px;
    }

    .person-card {
      position: relative;

      display: flex;

      align-items: center;

      gap: 19px;

      width: 100%;

      min-height: 104px;

      margin-bottom: 13px;

      padding: 15px 22px;

      background: var(--card);

      border:
        1px solid var(--border);

      border-radius: 23px;

      cursor: pointer;

      transition:
        transform .25s ease,
        border-color .25s ease,
        background .25s ease;

      overflow: hidden;
    }

    .person-card:hover {
      transform:
        translateY(-3px);

      border-color:
        rgba(255,255,255,.17);

      background:
        rgba(255,255,255,.075);
    }

    .person-card.first {
      background:
        linear-gradient(
          100deg,
          rgba(246,196,83,.13),
          rgba(255,255,255,.04)
        );

      border-color:
        rgba(246,196,83,.27);
    }

    .person-card.second {
      background:
        linear-gradient(
          100deg,
          rgba(190,199,216,.09),
          rgba(255,255,255,.035)
        );
    }

    .person-card.third {
      background:
        linear-gradient(
          100deg,
          rgba(194,125,71,.09),
          rgba(255,255,255,.035)
        );
    }

    .place {
      width: 60px;

      flex-shrink: 0;

      text-align: center;
    }

    .place-number {
      font-size: 25px;

      font-weight: 850;

      letter-spacing: -1px;
    }

    .first .place-number {
      color: #ffd96c;
    }

    .second .place-number {
      color: #d7dce5;
    }

    .third .place-number {
      color: #d59669;
    }

    .place-text {
      display: block;

      margin-top: 2px;

      color: #777d89;

      font-size: 11px;

      text-transform: uppercase;

      letter-spacing: 1px;
    }

    .avatar {
      width: 68px;
      height: 68px;

      border-radius: 19px;

      object-fit: cover;

      background: #15171d;

      border:
        1px solid rgba(255,255,255,.1);

      flex-shrink: 0;
    }

    .avatar-placeholder {
      width: 68px;
      height: 68px;

      border-radius: 19px;

      display: grid;
      place-items: center;

      background: #12141a;

      color: #555b67;

      font-size: 24px;

      flex-shrink: 0;
    }

    .person-info {
      flex: 1;

      min-width: 0;
    }

    .person-name {
      font-size: 19px;

      font-weight: 720;

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;
    }

    .person-sub {
      margin-top: 6px;

      color: #777d88;

      font-size: 13px;
    }

    .arrow {
      width: 37px;
      height: 37px;

      display: grid;
      place-items: center;

      border-radius: 50%;

      color: #858a95;

      background:
        rgba(255,255,255,.045);

      font-size: 18px;

      transition: .2s;
    }

    .person-card:hover .arrow {
      transform:
        translateX(3px);

      color: white;
    }

    .empty {
      text-align: center;

      padding: 80px 20px;

      color: #6f7480;
    }

    .empty-icon {
      font-size: 45px;

      margin-bottom: 15px;
    }

    /* =========================
       PERSON PAGE
    ========================= */

    .person-page {
      position: fixed;

      inset: 0;

      z-index: 500;

      overflow-y: auto;

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(246,196,83,.18),
          transparent 30%
        ),
        #06070b;

      opacity: 0;

      visibility: hidden;

      transform:
        scale(1.02);

      transition: .35s;
    }

    .person-page.active {
      opacity: 1;

      visibility: visible;

      transform: scale(1);
    }

    .back-button {
      position: fixed;

      left: 25px;
      top: 24px;

      z-index: 530;

      height: 46px;

      padding: 0 18px;

      border-radius: 14px;

      border:
        1px solid rgba(255,255,255,.1);

      color: white;

      background:
        rgba(15,16,21,.75);

      backdrop-filter:
        blur(15px);
    }

    .profile-container {
      width:
        min(760px, calc(100% - 30px));

      margin: 0 auto;

      padding:
        100px 0 80px;

      text-align: center;

      position: relative;

      z-index: 510;
    }

    .big-place {
      display: inline-flex;

      align-items: center;

      gap: 8px;

      margin-bottom: 22px;

      padding: 9px 16px;

      border-radius: 100px;

      color: #f8d77d;

      background:
        rgba(246,196,83,.1);

      border:
        1px solid rgba(246,196,83,.2);

      font-size: 14px;

      font-weight: 700;
    }

    .big-photo {
      width: 230px;
      height: 230px;

      border-radius: 42px;

      object-fit: cover;

      background: #111318;

      border:
        1px solid rgba(255,255,255,.13);

      box-shadow:
        0 30px 80px rgba(0,0,0,.5),
        0 0 70px rgba(246,196,83,.07);
    }

    .big-placeholder {
      width: 230px;
      height: 230px;

      margin: auto;

      border-radius: 42px;

      display: grid;
      place-items: center;

      font-size: 70px;

      color: #4e535e;

      background: #111318;

      border:
        1px solid rgba(255,255,255,.1);
    }

    .profile-name {
      margin-top: 28px;

      font-size:
        clamp(29px, 6vw, 48px);

      line-height: 1.08;

      letter-spacing: -1.7px;
    }

    .certificate-title {
      margin:
        70px 0 20px;

      color: #9297a2;

      text-transform:
        uppercase;

      letter-spacing:
        2.5px;

      font-size: 12px;

      font-weight: 700;
    }

    .diploma {
      width: 100%;

      max-height: 900px;

      object-fit: contain;

      border-radius: 24px;

      background: white;

      box-shadow:
        0 35px 100px rgba(0,0,0,.45);

      cursor: zoom-in;
    }

    .no-diploma {
      padding: 80px 20px;

      border:
        1px dashed rgba(255,255,255,.1);

      border-radius: 24px;

      color: #686e79;
    }

    /* =========================
       FIREWORKS
    ========================= */

    #fireworks {
      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      z-index: 505;

      pointer-events: none;
    }

    /* =========================
       LOGIN
    ========================= */

    .login {
      position: fixed;

      inset: 0;

      z-index: 1200;

      display: none;

      align-items: center;

      justify-content: center;

      padding: 20px;

      background:
        rgba(0,0,0,.75);

      backdrop-filter:
        blur(15px);
    }

    .login.active {
      display: flex;
    }

    .login-box {
      width:
        min(390px, 100%);

      padding: 32px;

      border-radius: 25px;

      background: #101116;

      border:
        1px solid rgba(255,255,255,.1);

      box-shadow:
        0 30px 100px rgba(0,0,0,.5);
    }

    .login-icon {
      width: 55px;
      height: 55px;

      display: grid;
      place-items: center;

      margin-bottom: 20px;

      border-radius: 17px;

      background:
        rgba(246,196,83,.1);

      font-size: 25px;
    }

    .login-box h2 {
      font-size: 24px;
    }

    .login-box p {
      color: #7f8490;

      margin:
        8px 0 20px;

      font-size: 14px;
    }

    .login-box input {
      width: 100%;

      height: 47px;

      padding: 0 14px;

      border:
        1px solid rgba(255,255,255,.09);

      border-radius: 12px;

      background: #101217;

      color: white;

      outline: none;
    }

    .login-error {
      color: #ff7484;

      font-size: 13px;

      margin-top: 10px;

      display: none;
    }

    .login-buttons {
      display: flex;

      gap: 10px;

      margin-top: 18px;
    }

    .login-buttons button {
      flex: 1;

      height: 45px;

      border-radius: 12px;
    }

    .cancel {
      border:
        1px solid rgba(255,255,255,.09);

      color: #aaaeb8;

      background:
        transparent;
    }

    .enter {
      border: 0;

      font-weight: 750;

      color: #17130b;

      background:
        linear-gradient(
          135deg,
          #ffe39a,
          #eab03d
        );
    }

    /* =========================
       ADMIN
    ========================= */

    .admin {
      position: fixed;

      inset: 0;

      z-index: 1000;

      background: #08090d;

      overflow-y: auto;

      display: none;
    }

    .admin.active {
      display: block;
    }

    .admin-header {
      height: 75px;

      padding: 0 6%;

      display: flex;

      align-items: center;

      justify-content: space-between;

      border-bottom:
        1px solid rgba(255,255,255,.07);

      background:
        rgba(8,9,13,.9);

      backdrop-filter:
        blur(20px);

      position: sticky;

      top: 0;

      z-index: 20;
    }

    .admin-header h2 {
      font-size: 19px;
    }

    .close-admin {
      border: 0;

      background: #17191f;

      color: #bbbfc7;

      padding:
        10px 16px;

      border-radius: 11px;
    }

    .admin-content {
      width:
        min(1000px, calc(100% - 30px));

      margin:
        40px auto 80px;
    }

    .admin-grid {
      display: grid;

      grid-template-columns:
        370px 1fr;

      gap: 25px;
    }

    .panel {
      border:
        1px solid rgba(255,255,255,.08);

      background:
        rgba(255,255,255,.035);

      border-radius: 22px;

      padding: 25px;
    }

    .panel h3 {
      font-size: 18px;

      margin-bottom: 22px;
    }

    label {
      display: block;

      margin:
        17px 0 8px;

      font-size: 12px;

      color: #9297a2;
    }

    .panel input {
      width: 100%;

      height: 47px;

      padding:
        0 14px;

      border:
        1px solid rgba(255,255,255,.09);

      border-radius: 12px;

      background: #101217;

      color: white;

      outline: none;
    }

    .panel input:focus {
      border-color:
        rgba(246,196,83,.45);
    }

    .panel input[type="file"] {
      height: auto;

      padding: 13px;

      color: #9297a2;
    }

    .save-button {
      width: 100%;

      min-height: 49px;

      margin-top: 23px;

      padding: 12px;

      border: 0;

      border-radius: 13px;

      color: #15110a;

      font-weight: 800;

      background:
        linear-gradient(
          135deg,
          #ffe49a,
          #eeb23d
        );
    }

    .save-button:disabled {
      opacity: .55;

      cursor: wait;
    }

    .admin-person {
      display: flex;

      align-items: center;

      gap: 13px;

      padding: 13px;

      margin-bottom: 9px;

      border:
        1px solid rgba(255,255,255,.07);

      border-radius: 15px;

      background:
        rgba(255,255,255,.025);
    }

    .admin-place {
      width: 37px;

      color: #e9bf5d;

      font-weight: 800;
    }

    .admin-person-name {
      flex: 1;

      font-size: 14px;
    }

    .edit-btn,
    .delete-btn {
      border: 0;

      border-radius: 9px;

      padding:
        8px 10px;
    }

    .edit-btn {
      color: #d5d8df;

      background: #20232b;
    }

    .delete-btn {
      color: #ff8895;

      background:
        rgba(255,91,110,.1);
    }

    /* =========================
       IMAGE VIEWER
    ========================= */

    .viewer {
      position: fixed;

      inset: 0;

      z-index: 2000;

      display: none;

      align-items: center;

      justify-content: center;

      padding: 20px;

      background:
        rgba(0,0,0,.94);

      cursor: zoom-out;
    }

    .viewer.active {
      display: flex;
    }

    .viewer img {
      max-width: 96%;

      max-height: 94vh;

      object-fit: contain;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media(max-width: 750px) {

      header {
        height: 68px;

        padding:
          0 18px;
      }

      .logo {
        font-size: 16px;
      }

      .logo-icon {
        width: 35px;
        height: 35px;
      }

      .admin-open {
        font-size: 12px;

        padding:
          9px 12px;
      }

      .hero {
        padding-top: 52px;
      }

      .hero h1 {
        letter-spacing: -2px;
      }

      .ranking {
        width:
          calc(100% - 20px);
      }

      .person-card {
        min-height: 88px;

        padding:
          11px 13px;

        gap: 11px;

        border-radius: 18px;
      }

      .place {
        width: 42px;
      }

      .place-number {
        font-size: 21px;
      }

      .avatar,
      .avatar-placeholder {
        width: 57px;
        height: 57px;

        border-radius: 15px;
      }

      .person-name {
        font-size: 15px;
      }

      .person-sub {
        font-size: 11px;
      }

      .arrow {
        width: 31px;
        height: 31px;
      }

      .admin-grid {
        grid-template-columns:
          1fr;
      }

      .panel {
        padding: 19px;
      }

      .back-button {
        top: 15px;

        left: 15px;
      }

      .profile-container {
        padding-top: 90px;
      }

      .big-photo,
      .big-placeholder {
        width: 190px;
        height: 190px;

        border-radius: 34px;
      }

      .certificate-title {
        margin-top: 50px;
      }

      .admin-person {
        flex-wrap: wrap;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="logo">

    <div class="logo-icon">
      ✦
    </div>

    <span>
      Награждение
    </span>

  </div>

  <button
    class="admin-open"
    onclick="showLogin()"
  >
    Управление
  </button>

</header>


<section class="hero">

  <div class="hero-medal">
    🏆
  </div>

  <h1>
    Награждение
  </h1>

  <p>
    Торжественный список участников
  </p>

</section>


<div
  class="status"
  id="status"
></div>


<main
  class="ranking"
  id="ranking"
>

  <div class="loading">

    <div class="spinner"></div>

    Загрузка...

  </div>

</main>


<!-- =========================
     PERSON PAGE
========================= -->

<section
  class="person-page"
  id="personPage"
>

  <canvas id="fireworks"></canvas>

  <button
    class="back-button"
    onclick="closePerson()"
  >
    ← Назад
  </button>


  <div class="profile-container">

    <div
      class="big-place"
      id="profilePlace"
    >
    </div>


    <div id="profilePhoto"></div>


    <h1
      class="profile-name"
      id="profileName"
    ></h1>


    <div class="certificate-title">
      Диплом
    </div>


    <div id="profileDiploma"></div>

  </div>

</section>


<!-- =========================
     LOGIN
========================= -->

<div
  class="login"
  id="login"
>

  <div class="login-box">

    <div class="login-icon">
      🔐
    </div>

    <h2>
      Вход
    </h2>

    <p>
      Введите пароль для доступа к управлению.
    </p>

    <input
      type="password"
      id="password"
      placeholder="Пароль"
      onkeydown="
        if(event.key === 'Enter') {
          loginAdmin()
        }
      "
    >

    <div
      class="login-error"
      id="loginError"
    >
      Неверный пароль
    </div>


    <div class="login-buttons">

      <button
        class="cancel"
        onclick="hideLogin()"
      >
        Отмена
      </button>

      <button
        class="enter"
        onclick="loginAdmin()"
      >
        Войти
      </button>

    </div>

  </div>

</div>


<!-- =========================
     ADMIN
========================= -->

<section
  class="admin"
  id="admin"
>

  <div class="admin-header">

    <h2>
      Управление
    </h2>

    <button
      class="close-admin"
      onclick="closeAdmin()"
    >
      Закрыть
    </button>

  </div>


  <div class="admin-content">

    <div class="admin-grid">

      <!-- FORM -->

      <div class="panel">

        <h3 id="formTitle">
          Добавить участника
        </h3>


        <label>
          Место
        </label>

        <input
          type="number"
          id="placeInput"
          min="1"
          placeholder="Например: 1"
        >


        <label>
          Имя и фамилия
        </label>

        <input
          type="text"
          id="nameInput"
          placeholder="Имя Фамилия"
        >


        <label>
          Фотография
        </label>

        <input
          type="file"
          id="photoInput"
          accept="image/*"
        >


        <label>
          Фото диплома
        </label>

        <input
          type="file"
          id="diplomaInput"
          accept="image/*"
        >


        <button
          class="save-button"
          id="saveButton"
          onclick="savePerson()"
        >
          Сохранить
        </button>

      </div>


      <!-- LIST -->

      <div class="panel">

        <h3>
          Список
        </h3>

        <div id="adminList"></div>

      </div>

    </div>

  </div>

</section>


<!-- =========================
     IMAGE VIEWER
========================= -->

<div
  class="viewer"
  id="viewer"
  onclick="closeViewer()"
>

  <img
    id="viewerImage"
    alt="Диплом"
  >

</div>


<script>

  /* =====================================================
     SUPABASE
  ===================================================== */

  const SUPABASE_URL =
    "https://ixhgnpcchuiniouwlgpx.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_FdkU41MMVnn_mDJnZqP6Qw_NmlynCCd";


  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =====================================================
     VARIABLES
  ===================================================== */

  let people = [];

  let editingId = null;

  let fireworksAnimation = null;

  let resizeHandler = null;


  /* =====================================================
     STATUS
  ===================================================== */

  function showError(message) {

    const status =
      document.getElementById("status");

    status.textContent =
      message;

    status.className =
      "status error";
  }


  function clearError() {

    const status =
      document.getElementById("status");

    status.textContent = "";

    status.className =
      "status";
  }


  /* =====================================================
     LOAD PEOPLE
  ===================================================== */

  async function loadPeople() {

    clearError();

    const {
      data,
      error
    } =
      await supabaseClient
        .from("awards")
        .select("*")
        .order(
          "place",
          {
            ascending: true
          }
        );


    if (error) {

      console.error(error);

      showError(
        "Не удалось загрузить список: " +
        error.message
      );

      return;
    }


    people =
      data || [];


    renderRanking();

    renderAdmin();
  }


  /* =====================================================
     REALTIME
  ===================================================== */

  supabaseClient
    .channel("awards-live")
    .on(
      "postgres_changes",
      {
        event: "*",
        schema: "public",
        table: "awards"
      },
      () => {

        loadPeople();

      }
    )
    .subscribe();


  /* =====================================================
     RENDER RANKING
  ===================================================== */

  function renderRanking() {

    const ranking =
      document.getElementById("ranking");


    ranking.innerHTML = "";


    const sorted =
      [...people].sort(
        (a, b) =>
          Number(a.place) -
          Number(b.place)
      );


    if (sorted.length === 0) {

      ranking.innerHTML = `

        <div class="empty">

          <div class="empty-icon">
            ✦
          </div>

          Список пока пуст

        </div>

      `;

      return;
    }


    sorted.forEach(person => {

      const card =
        document.createElement("div");


      let className = "";


      if (
        Number(person.place) === 1
      ) {

        className = "first";

      }


      if (
        Number(person.place) === 2
      ) {

        className = "second";

      }


      if (
        Number(person.place) === 3
      ) {

        className = "third";

      }


      card.className =
        `person-card ${className}`;


      card.onclick =
        () => openPerson(person.id);


      const photo =
        person.photo

        ? `
          <img
            class="avatar"
            src="${escapeAttribute(person.photo)}"
            alt=""
          >
        `

        : `
          <div class="avatar-placeholder">
            ✦
          </div>
        `;


      card.innerHTML = `

        <div class="place">

          <div class="place-number">
            ${person.place}
          </div>

          <span class="place-text">
            место
          </span>

        </div>


        ${photo}


        <div class="person-info">

          <div class="person-name">
            ${escapeHTML(person.name)}
          </div>

          <div class="person-sub">
            Посмотреть награду
          </div>

        </div>


        <div class="arrow">
          ›
        </div>

      `;


      ranking.appendChild(card);

    });

  }


  /* =====================================================
     OPEN PERSON
  ===================================================== */

  function openPerson(id) {

    const person =
      people.find(
        p => String(p.id) === String(id)
      );


    if (!person) {
      return;
    }


    document
      .getElementById("profileName")
      .textContent =
        person.name;


    document
      .getElementById("profilePlace")
      .textContent =
        `🏆 ${person.place} место`;


    const photoContainer =
      document.getElementById(
        "profilePhoto"
      );


    if (person.photo) {

      const image =
        document.createElement("img");

      image.className =
        "big-photo";

      image.src =
        person.photo;

      image.alt = "";

      photoContainer.innerHTML = "";

      photoContainer.appendChild(
        image
      );

    } else {

      photoContainer.innerHTML = `

        <div class="big-placeholder">
          ✦
        </div>

      `;

    }


    const diplomaContainer =
      document.getElementById(
        "profileDiploma"
      );


    diplomaContainer.innerHTML = "";


    if (person.diploma) {

      const image =
        document.createElement("img");

      image.className =
        "diploma";

      image.src =
        person.diploma;

      image.alt =
        "Диплом";

      image.onclick =
        () => openViewer(
          person.diploma
        );


      diplomaContainer.appendChild(
        image
      );

    } else {

      diplomaContainer.innerHTML = `

        <div class="no-diploma">
          Диплом не добавлен
        </div>

      `;

    }


    document
      .getElementById("personPage")
      .classList
      .add("active");


    document.body.style.overflow =
      "hidden";


    startFireworks();

  }


  function closePerson() {

    document
      .getElementById("personPage")
      .classList
      .remove("active");


    document.body.style.overflow =
      "";


    stopFireworks();

  }


  /* =====================================================
     IMAGE VIEWER
  ===================================================== */

  function openViewer(url) {

    document
      .getElementById("viewerImage")
      .src =
        url;


    document
      .getElementById("viewer")
      .classList
      .add("active");

  }


  function closeViewer() {

    document
      .getElementById("viewer")
      .classList
      .remove("active");

  }


  /* =====================================================
     LOGIN
  ===================================================== */

  function showLogin() {

    document
      .getElementById("login")
      .classList
      .add("active");


    setTimeout(
      () => {

        document
          .getElementById("password")
          .focus();

      },
      100
    );

  }


  function hideLogin() {

    document
      .getElementById("login")
      .classList
      .remove("active");


    document
      .getElementById("password")
      .value = "";


    document
      .getElementById("loginError")
      .style.display =
        "none";

  }


  function loginAdmin() {

    const password =
      document
        .getElementById("password")
        .value;


    if (
      password === "123321"
    ) {

      hideLogin();


      document
        .getElementById("admin")
        .classList
        .add("active");


      renderAdmin();


      document.body.style.overflow =
        "hidden";

    } else {

      document
        .getElementById("loginError")
        .style.display =
          "block";

    }

  }


  function closeAdmin() {

    document
      .getElementById("admin")
      .classList
      .remove("active");


    document.body.style.overflow =
      "";


    resetForm();

  }


  /* =====================================================
     UPLOAD FILE
  ===================================================== */

  async function uploadFile(
    file,
    folder
  ) {

    if (!file) {
      return null;
    }


    const extension =
      file.name
        .split(".")
        .pop()
        .toLowerCase();


    const randomName =
      crypto.randomUUID();


    const path =
      `${folder}/${Date.now()}-${randomName}.${extension}`;


    const {
      error
    } =
      await supabaseClient
        .storage
        .from("awards")
        .upload(
          path,
          file,
          {
            cacheControl: "3600",
            upsert: false
          }
        );


    if (error) {
      throw error;
    }


    const {
      data
    } =
      supabaseClient
        .storage
        .from("awards")
        .getPublicUrl(path);


    return data.publicUrl;

  }


  /* =====================================================
     DELETE STORAGE FILE
  ===================================================== */

  async function deleteStorageFile(url) {

    if (!url) {
      return;
    }


    try {

      const marker =
        "/storage/v1/object/public/awards/";


      const index =
        url.indexOf(marker);


      if (index === -1) {
        return;
      }


      const path =
        decodeURIComponent(
          url.substring(
            index + marker.length
          )
        );


      await supabaseClient
        .storage
        .from("awards")
        .remove([path]);


    } catch (error) {

      console.error(
        "Ошибка удаления файла:",
        error
      );

    }

  }


  /* =====================================================
     SAVE PERSON
  ===================================================== */

  async function savePerson() {

    const saveButton =
      document.getElementById(
        "saveButton"
      );


    const place =
      document
        .getElementById("placeInput")
        .value
        .trim();


    const name =
      document
        .getElementById("nameInput")
        .value
        .trim();


    const photoFile =
      document
        .getElementById("photoInput")
        .files[0];


    const diplomaFile =
      document
        .getElementById("diplomaInput")
        .files[0];


    if (
      !place ||
      !name
    ) {

      alert(
        "Введите место и имя"
      );

      return;

    }


    if (
      Number(place) < 1
    ) {

      alert(
        "Место должно быть от 1 и выше"
      );

      return;

    }


    const samePlace =
      people.find(
        person =>

          Number(person.place) ===
            Number(place)

          &&

          String(person.id) !==
            String(editingId)
      );


    if (samePlace) {

      alert(
        "Это место уже занято"
      );

      return;

    }


    saveButton.disabled = true;

    saveButton.textContent =
      "Загрузка...";


    try {

      let photoURL = null;

      let diplomaURL = null;


      if (photoFile) {

        photoURL =
          await uploadFile(
            photoFile,
            "people"
          );

      }


      if (diplomaFile) {

        diplomaURL =
          await uploadFile(
            diplomaFile,
            "diplomas"
          );

      }


      /* =====================
         EDIT
      ===================== */

      if (editingId !== null) {

        const oldPerson =
          people.find(
            p =>
              String(p.id) ===
              String(editingId)
          );


        if (!oldPerson) {
          throw new Error(
            "Участник не найден"
          );
        }


        const updateData = {

          place:
            Number(place),

          name:
            name

        };


        if (photoURL) {

          updateData.photo =
            photoURL;

        }


        if (diplomaURL) {

          updateData.diploma =
            diplomaURL;

        }


        const {
          error
        } =
          await supabaseClient
            .from("awards")
            .update(updateData)
            .eq(
              "id",
              editingId
            );


        if (error) {
          throw error;
        }


        if (
          photoURL &&
          oldPerson.photo
        ) {

          await deleteStorageFile(
            oldPerson.photo
          );

        }


        if (
          diplomaURL &&
          oldPerson.diploma
        ) {

          await deleteStorageFile(
            oldPerson.diploma
          );

        }

      }


      /* =====================
         CREATE
      ===================== */

      else {

        const {
          error
        } =
          await supabaseClient
            .from("awards")
            .insert({

              place:
                Number(place),

              name:
                name,

              photo:
                photoURL,

              diploma:
                diplomaURL

            });


        if (error) {
          throw error;
        }

      }


      resetForm();


      await loadPeople();


      alert(
        editingId === null
          ? "Сохранено"
          : "Изменения сохранены"
      );


    } catch (error) {

      console.error(error);


      alert(
        "Ошибка: " +
        (
          error.message ||
          "не удалось сохранить"
        )
      );

    } finally {

      saveButton.disabled =
        false;

      saveButton.textContent =
        "Сохранить";

    }

  }


  /* =====================================================
     ADMIN LIST
  ===================================================== */

  function renderAdmin() {

    const list =
      document.getElementById(
        "adminList"
      );


    if (!list) {
      return;
    }


    list.innerHTML = "";


    const sorted =
      [...people].sort(
        (a, b) =>
          Number(a.place) -
          Number(b.place)
      );


    if (
      sorted.length === 0
    ) {

      list.innerHTML = `

        <div style="
          color:#737985;
          padding:10px 0;
        ">
          Список пуст
        </div>

      `;

      return;

    }


    sorted.forEach(person => {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "admin-person";


      const place =
        document.createElement(
          "div"
        );

      place.className =
        "admin-place";

      place.textContent =
        "#" + person.place;


      const name =
        document.createElement(
          "div"
        );

      name.className =
        "admin-person-name";

      name.textContent =
        person.name;


      const editButton =
        document.createElement(
          "button"
        );

      editButton.className =
        "edit-btn";

      editButton.textContent =
        "Изменить";

      editButton.onclick =
        () =>
          editPerson(
            person.id
          );


      const deleteButton =
        document.createElement(
          "button"
        );

      deleteButton.className =
        "delete-btn";

      deleteButton.textContent =
        "×";

      deleteButton.onclick =
        () =>
          deletePerson(
            person.id
          );


      item.append(
        place,
        name,
        editButton,
        deleteButton
      );


      list.appendChild(item);

    });

  }


  /* =====================================================
     EDIT PERSON
  ===================================================== */

  function editPerson(id) {

    const person =
      people.find(
        p =>
          String(p.id) ===
          String(id)
      );


    if (!person) {
      return;
    }


    editingId =
      person.id;


    document
      .getElementById("formTitle")
      .textContent =
        "Изменить участника";


    document
      .getElementById("placeInput")
      .value =
        person.place;


    document
      .getElementById("nameInput")
      .value =
        person.name;


    document
      .getElementById("saveButton")
      .textContent =
        "Сохранить изменения";


    document
      .getElementById("admin")
      .scrollTo({

        top: 0,

        behavior:
          "smooth"

      });

  }


  /* =====================================================
     DELETE PERSON
  ===================================================== */

  async function deletePerson(id) {

    const person =
      people.find(
        p =>
          String(p.id) ===
          String(id)
      );


    if (!person) {
      return;
    }


    const confirmed =
      confirm(
        `Удалить ${person.name}?`
      );


    if (!confirmed) {
      return;
    }


    try {

      const {
        error
      } =
        await supabaseClient
          .from("awards")
          .delete()
          .eq(
            "id",
            person.id
          );


      if (error) {
        throw error;
      }


      await deleteStorageFile(
        person.photo
      );


      await deleteStorageFile(
        person.diploma
      );


      if (
        String(editingId) ===
        String(person.id)
      ) {

        resetForm();

      }


      await loadPeople();


    } catch (error) {

      console.error(error);


      alert(
        "Не удалось удалить: " +
        error.message
      );

    }

  }


  /* =====================================================
     RESET FORM
  ===================================================== */

  function resetForm() {

    editingId = null;


    document
      .getElementById("formTitle")
      .textContent =
        "Добавить участника";


    document
      .getElementById("placeInput")
      .value = "";


    document
      .getElementById("nameInput")
      .value = "";


    document
      .getElementById("photoInput")
      .value = "";


    document
      .getElementById("diplomaInput")
      .value = "";


    document
      .getElementById("saveButton")
      .textContent =
        "Сохранить";

  }


  /* =====================================================
     FIREWORKS
  ===================================================== */

  function startFireworks() {

    stopFireworks();


    const canvas =
      document.getElementById(
        "fireworks"
      );


    const ctx =
      canvas.getContext("2d");


    let width =
      window.innerWidth;


    let height =
      window.innerHeight;


    let particles = [];

    let rockets = [];


    const colors = [

      "#ffd76a",
      "#ffffff",
      "#ff8a65",
      "#82b1ff",
      "#e99cff",
      "#7dffb2"

    ];


    function resize() {

      const ratio =
        window.devicePixelRatio || 1;


      width =
        window.innerWidth;


      height =
        window.innerHeight;


      canvas.width =
        width * ratio;


      canvas.height =
        height * ratio;


      canvas.style.width =
        width + "px";


      canvas.style.height =
        height + "px";


      ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
      );

    }


    resize();


    resizeHandler =
      resize;


    window.addEventListener(
      "resize",
      resizeHandler
    );


    function createExplosion(
      x,
      y
    ) {

      const count =
        45 +
        Math.floor(
          Math.random() * 35
        );


      const color =
        colors[
          Math.floor(
            Math.random() *
            colors.length
          )
        ];


      for (
        let i = 0;
        i < count;
        i++
      ) {

        const angle =
          Math.random() *
          Math.PI *
          2;


        const speed =
          1.5 +
          Math.random() *
          5;


        particles.push({

          x: x,

          y: y,

          vx:
            Math.cos(angle) *
            speed,

          vy:
            Math.sin(angle) *
            speed,

          life: 1,

          decay:
            .012 +
            Math.random() *
            .013,

          size:
            1 +
            Math.random() *
            2.3,

          color:
            color

        });

      }

    }


    function createRocket() {

      rockets.push({

        x:
          width *
          (
            .12 +
            Math.random() *
            .76
          ),

        y:
          height + 20,

        targetY:
          height *
          (
            .12 +
            Math.random() *
            .45
          ),

        speed:
          7 +
          Math.random() *
          4,

        trail: []

      });

    }


    function animate() {

      ctx.clearRect(
        0,
        0,
        width,
        height
      );


      for (
        let i =
          rockets.length - 1;

        i >= 0;

        i--
      ) {

        const r =
          rockets[i];


        r.trail.push({

          x: r.x,

          y: r.y

        });


        if (
          r.trail.length > 13
        ) {

          r.trail.shift();

        }


        r.trail.forEach(
          (t, index) => {

            ctx.beginPath();

            ctx.arc(
              t.x,
              t.y,
              1.5,
              0,
              Math.PI * 2
            );

            ctx.fillStyle =
              `rgba(255,220,130,${
                index /
                r.trail.length
              })`;

            ctx.fill();

          }
        );


        r.y -=
          r.speed;


        ctx.beginPath();


        ctx.arc(
          r.x,
          r.y,
          2.5,
          0,
          Math.PI * 2
        );


        ctx.fillStyle =
          "#fff4bd";


        ctx.fill();


        if (
          r.y <= r.targetY
        ) {

          createExplosion(
            r.x,
            r.y
          );


          rockets.splice(
            i,
            1
          );

        }

      }


      for (
        let i =
          particles.length - 1;

        i >= 0;

        i--
      ) {

        const p =
          particles[i];


        p.x +=
          p.vx;


        p.y +=
          p.vy;


        p.vy +=
          .045;


        p.vx *=
          .992;


        p.life -=
          p.decay;


        ctx.globalAlpha =
          Math.max(
            p.life,
            0
          );


        ctx.beginPath();


        ctx.arc(
          p.x,
          p.y,
          p.size,
          0,
          Math.PI * 2
        );


        ctx.fillStyle =
          p.color;


        ctx.fill();


        if (
          p.life <= 0
        ) {

          particles.splice(
            i,
            1
          );

        }

      }


      ctx.globalAlpha =
        1;


      if (
        Math.random() <
          .035

        &&

        rockets.length <
          5
      ) {

        createRocket();

      }


      fireworksAnimation =
        requestAnimationFrame(
          animate
        );

    }


    createRocket();


    setTimeout(
      createRocket,
      250
    );


    setTimeout(
      createRocket,
      500
    );


    animate();

  }


  function stopFireworks() {

    if (
      fireworksAnimation
    ) {

      cancelAnimationFrame(
        fireworksAnimation
      );


      fireworksAnimation =
        null;

    }


    if (
      resizeHandler
    ) {

      window.removeEventListener(
        "resize",
        resizeHandler
      );


      resizeHandler =
        null;

    }


    const canvas =
      document.getElementById(
        "fireworks"
      );


    const ctx =
      canvas.getContext("2d");


    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

  }


  /* =====================================================
     ESCAPE
  ===================================================== */

  function escapeHTML(value) {

    return String(value)

      .replaceAll(
        "&",
        "&amp;"
      )

      .replaceAll(
        "<",
        "&lt;"
      )

      .replaceAll(
        ">",
        "&gt;"
      )

      .replaceAll(
        '"',
        "&quot;"
      )

      .replaceAll(
        "'",
        "&#039;"
      );

  }


  function escapeAttribute(
    value
  ) {

    return escapeHTML(
      value
    );

  }


  /* =====================================================
     START
  ===================================================== */

  loadPeople();

</script>
