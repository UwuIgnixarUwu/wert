<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#061a35">

<title>Панорама педагогических идей — Өрлеу 2026</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --navy:#071a35;
    --navy2:#0b294d;
    --blue:#087dbd;
    --blue2:#14a7d5;
    --cyan:#56c6e3;
    --gold:#ffd86b;
    --gold2:#e5a82d;
}

html,body{
    min-height:100%;
}

body{
    font-family:Inter,"Segoe UI",Arial,sans-serif;
    background:#f7fbfe;
    color:var(--navy);
    overflow-x:hidden;
}

button{
    font:inherit;
}

/* =========================================================
   ГЛАВНЫЙ ФОН
========================================================= */

.site-bg{
    position:fixed;
    inset:0;
    z-index:-5;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(37,175,221,.14),
            transparent 28%
        ),
        radial-gradient(
            circle at 90% 30%,
            rgba(12,109,175,.11),
            transparent 30%
        ),
        linear-gradient(
            145deg,
            #ffffff 0%,
            #f4fbff 55%,
            #edf8fd 100%
        );
}

.grid-pattern{
    position:absolute;
    inset:0;

    background-image:
        linear-gradient(
            rgba(9,72,120,.035) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(9,72,120,.035) 1px,
            transparent 1px
        );

    background-size:42px 42px;
}

.square{
    position:absolute;
    width:60px;
    height:60px;
    transform:rotate(14deg);
    opacity:.13;
}

.s1{
    background:#0b86c6;
    left:4%;
    top:15%;
}

.s2{
    background:#28b9dc;
    left:10%;
    top:23%;
    width:32px;
    height:32px;
}

.s3{
    background:#173d69;
    right:7%;
    top:13%;
    width:80px;
    height:80px;
}

.s4{
    background:#16a5d2;
    right:15%;
    top:30%;
    width:38px;
    height:38px;
}

.s5{
    background:#17416f;
    left:8%;
    bottom:12%;
    width:90px;
    height:90px;
}

.s6{
    background:#24b5d7;
    right:5%;
    bottom:9%;
    width:70px;
    height:70px;
}

/* =========================================================
   HEADER
========================================================= */

header{
    height:86px;
    padding:0 6%;

    display:flex;
    align-items:center;
    justify-content:space-between;

    border-bottom:1px solid rgba(7,55,93,.08);

    background:rgba(255,255,255,.72);
    backdrop-filter:blur(18px);
}

.brand{
    display:flex;
    align-items:center;
    gap:14px;
}

.brand-symbol{
    width:46px;
    height:46px;

    display:grid;
    grid-template-columns:1fr 1fr;
    gap:3px;

    transform:rotate(12deg);
}

.brand-symbol span{
    border-radius:2px;
}

.brand-symbol span:nth-child(1){
    background:#183e6b;
}

.brand-symbol span:nth-child(2){
    background:#48b7dd;
}

.brand-symbol span:nth-child(3){
    background:#0c87c7;
}

.brand-symbol span:nth-child(4){
    background:#82c6e7;
}

.brand-title{
    font-size:15px;
    font-weight:900;
    letter-spacing:.8px;
}

.brand-sub{
    margin-top:3px;
    font-size:11px;
    color:#648098;
    letter-spacing:1.2px;
    text-transform:uppercase;
}

.year{
    padding:9px 16px;
    border-radius:100px;

    color:#0d679d;

    font-size:12px;
    font-weight:800;
    letter-spacing:1.5px;

    border:1px solid rgba(14,132,190,.16);

    background:rgba(19,155,207,.07);
}

/* =========================================================
   HERO
========================================================= */

.hero{
    max-width:1250px;
    margin:auto;
    padding:75px 30px 58px;
    text-align:center;
}

.hero-label{
    display:inline-flex;
    align-items:center;
    gap:9px;

    padding:9px 16px;

    border-radius:100px;

    background:#e8f7fd;

    border:1px solid #d2eef9;

    color:#0874ac;

    font-size:12px;
    font-weight:800;

    letter-spacing:1.5px;
    text-transform:uppercase;
}

.hero-label::before{
    content:"";

    width:7px;
    height:7px;

    border-radius:50%;

    background:#12a8d4;

    box-shadow:0 0 12px #12a8d4;
}

.hero h1{
    max-width:950px;

    margin:23px auto 0;

    font-size:clamp(42px,6.4vw,84px);

    line-height:.96;

    letter-spacing:-4px;

    color:#071c37;
}

.hero h1 span{
    display:block;

    margin-top:11px;

    color:#1189bd;

    font-weight:500;
}

.hero-line{
    width:min(520px,80%);
    height:3px;

    margin:31px auto 0;

    background:
        linear-gradient(
            90deg,
            transparent,
            #13a6d3,
            #173e69,
            transparent
        );
}

.hero-description{
    margin-top:22px;

    color:#688197;

    font-size:15px;
}

/* =========================================================
   МЕСТА
========================================================= */

.places{
    width:min(1180px,calc(100% - 30px));

    margin:10px auto 110px;
}

/* =========================================================
   1 МЕСТО
========================================================= */

.first-place{
    min-height:285px;

    margin-bottom:20px;

    position:relative;

    overflow:hidden;

    display:flex;
    align-items:center;

    padding:45px 55px;

    border-radius:38px;

    cursor:pointer;

    border:1px solid rgba(255,220,110,.28);

    background:
        radial-gradient(
            circle at 80% 40%,
            rgba(61,196,232,.28),
            transparent 30%
        ),
        linear-gradient(
            120deg,
            #071c39 0%,
            #0a3e69 55%,
            #0c83b3 130%
        );

    color:white;

    box-shadow:
        0 35px 90px rgba(8,52,88,.22);

    transition:.35s;
}

.first-place:hover{
    transform:translateY(-7px) scale(1.005);

    box-shadow:
        0 45px 110px rgba(8,52,88,.3);
}

.first-place::before{
    content:"";

    position:absolute;

    width:430px;
    height:430px;

    right:-100px;
    top:-190px;

    border-radius:50%;

    border:70px solid rgba(255,255,255,.035);
}

.first-content{
    position:relative;

    z-index:3;

    flex:1;
}

.place-small{
    color:#ffe39a;

    font-size:12px;
    font-weight:800;

    letter-spacing:3px;

    text-transform:uppercase;
}

.first-number{
    margin-top:7px;

    font-size:clamp(70px,10vw,125px);

    line-height:.85;

    font-weight:950;

    letter-spacing:-7px;

    color:#fff;
}

.first-number span{
    font-size:.28em;

    letter-spacing:0;

    color:#bceafb;
}

.first-text{
    margin-top:20px;

    color:#b7d6e8;

    font-size:14px;
}

.first-arrow{
    position:absolute;

    right:35px;
    bottom:30px;

    width:48px;
    height:48px;

    border-radius:50%;

    display:grid;
    place-items:center;

    background:rgba(255,255,255,.11);

    border:1px solid rgba(255,255,255,.14);

    font-size:24px;
}

/* =========================================================
   КУБОК
========================================================= */

.trophy-area{
    width:290px;

    display:flex;
    justify-content:center;

    position:relative;

    z-index:3;
}

.trophy{
    position:relative;

    width:160px;
    height:190px;

    flex:0 0 auto;

    filter:
        drop-shadow(0 25px 28px rgba(0,0,0,.28));
}

.trophy-cup{
    position:absolute;

    left:35px;
    top:5px;

    width:90px;
    height:85px;

    border-radius:8px 8px 45px 45px;

    background:
        linear-gradient(
            90deg,
            #bd7d15,
            #ffe89a 25%,
            #f5bd37 52%,
            #fff1ae 72%,
            #b9700d
        );
}

.trophy-cup::before,
.trophy-cup::after{
    content:"";

    position:absolute;

    top:13px;

    width:44px;
    height:48px;

    border:10px solid #e8aa2a;
}

.trophy-cup::before{
    left:-38px;

    border-right:0;

    border-radius:30px 0 0 30px;
}

.trophy-cup::after{
    right:-38px;

    border-left:0;

    border-radius:0 30px 30px 0;
}

.trophy-stem{
    position:absolute;

    left:70px;
    top:87px;

    width:20px;
    height:45px;

    background:
        linear-gradient(
            90deg,
            #b8700d,
            #ffd96b,
            #bd7711
        );
}

.trophy-base1{
    position:absolute;

    left:48px;
    top:125px;

    width:64px;
    height:17px;

    border-radius:5px;

    background:
        linear-gradient(
            90deg,
            #ad6710,
            #ffe58b,
            #b46b0d
        );
}

.trophy-base2{
    position:absolute;

    left:31px;
    top:141px;

    width:98px;
    height:27px;

    border-radius:7px;

    background:
        linear-gradient(
            90deg,
            #70410c,
            #d69522,
            #ffdc6d,
            #8c520d
        );
}

.trophy-star{
    position:absolute;

    left:62px;
    top:28px;

    z-index:5;

    color:white;

    font-size:35px;

    text-shadow:0 0 20px white;
}

.first-place .trophy{
    transform:scale(1.28);
}

/* =========================================================
   2 + 3 МЕСТО
========================================================= */

.podium-row{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:20px;
}

.podium-card{
    min-height:205px;

    position:relative;

    overflow:hidden;

    display:flex;
    align-items:center;

    padding:32px;

    border-radius:30px;

    cursor:pointer;

    border:1px solid rgba(12,85,133,.12);

    background:rgba(255,255,255,.78);

    box-shadow:
        0 18px 60px rgba(19,70,104,.08);

    transition:.3s;
}

.podium-card:hover{
    transform:translateY(-5px);

    box-shadow:
        0 28px 70px rgba(19,70,104,.14);
}

.podium-card .trophy-area{
    width:180px;
}

.second .trophy{
    transform:scale(.78);
}

.second .trophy-cup,
.second .trophy-stem,
.second .trophy-base1,
.second .trophy-base2{
    filter:
        grayscale(1)
        brightness(1.35);
}

.third .trophy{
    transform:scale(.68);
}

.third .trophy-cup,
.third .trophy-stem,
.third .trophy-base1,
.third .trophy-base2{
    filter:
        sepia(.8)
        saturate(.8)
        brightness(.8);
}

.podium-number{
    font-size:60px;

    line-height:1;

    font-weight:950;

    letter-spacing:-4px;

    color:#092b4d;
}

.podium-number span{
    font-size:18px;

    letter-spacing:0;

    color:#5e849d;
}

.podium-info{
    margin-top:10px;

    color:#7790a3;

    font-size:13px;
}

/* =========================================================
   ЭКРАН ПРИЗЁРА

   ТУТ УЖЕ НЕТ GIF-ФОНА.
   ЭТО ОБЫЧНЫЙ ИЗНАЧАЛЬНЫЙ ТЁМНЫЙ ФОН.
========================================================= */

.winner-page{
    position:fixed;

    inset:0;

    z-index:1000;

    visibility:hidden;

    opacity:0;

    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 0%,
            #135e91 0%,
            #071d3a 45%,
            #041226 100%
        );

    color:white;

    transition:
        opacity .45s ease,
        visibility .45s ease;
}

.winner-page.active{
    visibility:visible;
    opacity:1;
}

/* =========================================================
   GIF ЗАСТАВКА

   ОНА ПОКАЗЫВАЕТСЯ ПЕРВОЙ.
   ПОСЛЕ КЛИКА ИСЧЕЗАЕТ.
========================================================= */

.winner-intro{
    position:absolute;

    inset:0;

    z-index:100;

    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#041226;

    cursor:pointer;

    opacity:1;

    visibility:visible;

    transition:
        opacity .65s ease,
        visibility .65s ease;
}

.winner-intro.hide{
    opacity:0;

    visibility:hidden;

    pointer-events:none;
}

/* Размытый GIF сзади */

.winner-intro-blur{
    position:absolute;

    inset:-60px;

    width:calc(100% + 120px);
    height:calc(100% + 120px);

    object-fit:cover;

    object-position:center;

    filter:
        blur(40px)
        brightness(.48)
        saturate(1.2);

    transform:scale(1.08);
}

/* Основной GIF */

.winner-intro-main{
    position:absolute;

    inset:0;

    z-index:2;

    width:100%;
    height:100%;

    object-fit:contain;

    object-position:center;

    filter:brightness(.95);
}

/* Лёгкое затемнение */

.winner-intro::after{
    content:"";

    position:absolute;

    inset:0;

    z-index:3;

    pointer-events:none;

    background:
        linear-gradient(
            to bottom,
            rgba(0,8,20,.05),
            rgba(0,8,20,.02) 55%,
            rgba(0,8,20,.48)
        );
}

/* Текст на GIF */

.winner-intro-text{
    position:absolute;

    z-index:5;

    left:50%;
    bottom:42px;

    transform:translateX(-50%);

    padding:13px 23px;

    border-radius:100px;

    color:white;

    background:rgba(2,19,45,.70);

    border:1px solid rgba(255,255,255,.25);

    backdrop-filter:blur(15px);

    box-shadow:
        0 15px 45px rgba(0,0,0,.25);

    font-size:13px;

    font-weight:800;

    letter-spacing:1px;

    white-space:nowrap;

    animation:introPulse 1.6s ease-in-out infinite;
}

@keyframes introPulse{
    0%,100%{
        transform:
            translateX(-50%)
            scale(1);

        opacity:.8;
    }

    50%{
        transform:
            translateX(-50%)
            scale(1.05);

        opacity:1;
    }
}

/* =========================================================
   ФЕЙЕРВЕРКИ

   СКРЫТЫ, ПОКА ПОКАЗЫВАЕТСЯ GIF.
========================================================= */

.fireworks-video{
    position:absolute;

    inset:0;

    z-index:2;

    width:100%;
    height:100%;

    object-fit:cover;

    pointer-events:none;

    mix-blend-mode:screen;

    opacity:.9;
}

.winner-overlay{
    position:absolute;

    inset:0;

    z-index:3;

    pointer-events:none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 20%,
            rgba(1,12,31,.05) 55%,
            rgba(1,12,31,.25) 100%
        );
}

/* =========================================================
   КОНТЕНТ ПРИЗЁРА
========================================================= */

.winner-scroll{
    position:absolute;

    inset:0;

    z-index:10;

    overflow-y:auto;
}

.winner-content{
    width:min(1450px,calc(100% - 50px));

    min-height:100%;

    margin:auto;

    padding:25px 0 80px;
}

.winner-header{
    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:10px;
}

.winner-logo{
    display:flex;

    align-items:center;

    gap:12px;

    padding:8px 13px;

    border-radius:15px;

    background:rgba(3,27,61,.38);

    backdrop-filter:blur(12px);

    border:1px solid rgba(255,255,255,.13);

    font-size:13px;

    font-weight:800;

    letter-spacing:1px;

    text-shadow:
        0 2px 10px rgba(0,0,0,.5);
}

.close-winner{
    width:46px;
    height:46px;

    border-radius:14px;

    border:1px solid rgba(255,255,255,.20);

    background:rgba(3,27,61,.48);

    color:white;

    font-size:19px;

    cursor:pointer;

    backdrop-filter:blur(12px);

    transition:.2s;
}

.close-winner:hover{
    background:rgba(9,76,126,.75);

    transform:scale(1.05);
}

/* =========================================================
   МЕСТО

   ВАЖНО:
   ТЕПЕРЬ ТЕКСТ НЕ ЛЕЗЕТ ПОД КУБОК.
========================================================= */

/* =========================================================
   ЗАГОЛОВОК МЕСТА
========================================================= */

.winner-place-title{
    position:relative;
    z-index:20;

    width:100%;

    text-align:center;

    margin:10px 0 0;
}

.winner-place-title .mini{
    display:inline-block;

    padding:6px 13px;

    border-radius:100px;

    color:#d3f4ff;

    background:rgba(3,35,75,.45);

    border:1px solid rgba(255,255,255,.12);

    backdrop-filter:blur(10px);

    font-size:10px;
    font-weight:800;

    letter-spacing:3px;

    text-transform:uppercase;
}

.winner-place-title h2{
    position:relative;

    z-index:20;

    display:block;

    margin:12px 0 0;

    padding:0;

    font-size:clamp(42px,5vw,68px);

    line-height:1.1;

    letter-spacing:-3px;

    color:white;

    text-align:center;

    text-shadow:
        0 5px 25px rgba(0,0,0,.75);
}


/* =========================================================
   ПЕРВОЕ МЕСТО
========================================================= */

.place-1 .winner-place-title h2{
    color:#ffe18a;

    text-shadow:
        0 5px 25px rgba(0,0,0,.7),
        0 0 35px rgba(255,212,99,.35);
}


/* =========================================================
   КУБОК

   ВАЖНО:
   НИКАКИХ translateY.
   КУБОК НАХОДИТСЯ В СВОЕЙ ОТДЕЛЬНОЙ СТРОКЕ.
========================================================= */

.winner-trophy{
    position:relative;

    z-index:10;

    width:100%;
    height:125px;

    display:flex;

    justify-content:center;

    align-items:flex-start;

    margin:20px 0 20px;

    padding:0;

    overflow:visible;
}


/* обычный кубок */

.winner-trophy .trophy{
    position:relative;

    margin:0;

    flex:0 0 auto;

    transform:scale(.52);

    transform-origin:top center;
}


/* кубок первого места */

.place-1 .winner-trophy .trophy{
    transform:scale(.58);

    transform-origin:top center;
}


/* =========================================================
   ФОТО + ДИПЛОМ

   НАЧИНАЮТСЯ ТОЛЬКО ПОСЛЕ КУБКА
========================================================= */

.winner-main{
    position:relative;

    z-index:10;

    display:grid;

    grid-template-columns:
        minmax(280px,.68fr)
        minmax(460px,1.32fr);

    gap:25px;

    align-items:stretch;

    max-width:1250px;

    margin:0 auto;
}
.person-panel,
.diploma-panel{
    border:1px solid rgba(255,255,255,.22);

    background:rgba(2,26,61,.28);

    backdrop-filter:
        blur(12px)
        saturate(1.1);

    border-radius:28px;

    box-shadow:
        0 25px 70px rgba(0,0,0,.26);
}

.place-1 .person-panel,
.place-1 .diploma-panel{
    border-color:rgba(255,221,125,.32);

    box-shadow:
        0 30px 90px rgba(0,0,0,.28),
        0 0 40px rgba(255,210,90,.06);
}

/* =========================================================
   ФОТО
========================================================= */

.person-panel{
    padding:15px;

    display:flex;

    flex-direction:column;
}

.person-photo-wrap{
    width:100%;

    flex:1;

    min-height:390px;

    position:relative;

    overflow:hidden;

    border-radius:20px;

    background:
        linear-gradient(
            145deg,
            #0d3d65,
            #09223e
        );
}

.person-photo{
    width:100%;
    height:100%;

    position:absolute;

    inset:0;

    object-fit:cover;
}

.person-photo-wrap::after{
    content:"";

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            transparent 45%,
            rgba(2,15,31,.92)
        );
}

.person-name{
    position:absolute;

    z-index:3;

    left:20px;
    right:20px;
    bottom:20px;

    font-size:clamp(22px,2.5vw,34px);

    font-weight:850;

    letter-spacing:-1px;

    line-height:1.05;

    text-shadow:
        0 4px 20px rgba(0,0,0,.9);
}

.person-index{
    margin-top:12px;

    text-align:center;

    color:#c5eaff;

    font-size:12px;

    letter-spacing:1px;
}

/* =========================================================
   ДИПЛОМ
========================================================= */

.diploma-panel{
    padding:15px;

    display:flex;

    align-items:center;

    justify-content:center;

    min-height:450px;
}

.diploma-image{
    display:block;

    max-width:100%;

    max-height:600px;

    object-fit:contain;

    border-radius:12px;

    box-shadow:
        0 20px 55px rgba(0,0,0,.40);

    cursor:zoom-in;
}

/* =========================================================
   НАВИГАЦИЯ
========================================================= */

.winner-navigation{
    margin-top:18px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:13px;
}

.nav-button{
    min-width:150px;

    height:50px;

    padding:0 22px;

    border-radius:16px;

    border:1px solid rgba(255,255,255,.20);

    color:white;

/* =========================================================
   VARIABLES
========================================================= */

let currentPlace = 1;

let currentIndex = 0;

let currentPeople = [];

/* =========================================================
   TROPHY
========================================================= */

function trophyHTML(place){

    if(place > 3){
        return "";
    }

    let star = "★";

    if(place === 2){
        star = "Ⅱ";
    }

    if(place === 3){
        star = "Ⅲ";
    }

    return `
        <div class="trophy">

            <div class="trophy-cup"></div>

            <div class="trophy-star">
                ${star}
            </div>

            <div class="trophy-stem"></div>

            <div class="trophy-base1"></div>

            <div class="trophy-base2"></div>

        </div>
    `;
}

/* =========================================================
   ГЛАВНАЯ
========================================================= */

function renderPlaces(){

    const container =
        document.getElementById("places");

    container.innerHTML = "";

    /* =====================================================
       1 МЕСТО
    ===================================================== */

    const first =
        document.createElement("div");

    first.className =
        "first-place";

    first.onclick =
        () => openPlace(1);

    first.innerHTML = `

        <div class="first-content">

            <div class="place-small">
                Главное достижение
            </div>

            <div class="first-number">

                1

                <span>
                    место
                </span>

            </div>

            <div class="first-text">
                Открыть результаты
            </div>

        </div>

        <div class="trophy-area">

            ${trophyHTML(1)}

        </div>

        <div class="first-arrow">
            →
        </div>

    `;

    container.appendChild(first);

    /* =====================================================
       2 + 3 МЕСТО
    ===================================================== */

    const row =
        document.createElement("div");

    row.className =
        "podium-row";

    [2,3].forEach(place => {

        const card =
            document.createElement("div");

        card.className =
            "podium-card " +
            (
                place === 2
                    ? "second"
                    : "third"
            );

        card.onclick =
            () => openPlace(place);

        card.innerHTML = `

            <div style="flex:1">

                <div class="podium-number">

                    ${place}

                    <span>
                        место
                    </span>

                </div>

                <div class="podium-info">
                    Открыть результаты →
                </div>

            </div>

            <div class="trophy-area">

                ${trophyHTML(place)}

            </div>

        `;

        row.appendChild(card);

    });

    container.appendChild(row);
}

/* =========================================================
   ОТКРЫТИЕ МЕСТА

   ВАЖНО:
   СНАЧАЛА ПОКАЗЫВАЕМ GIF.
========================================================= */

function openPlace(place){

    currentPlace = place;

    currentPeople =
        winners.filter(
            person =>
                person.place === place
        );

    if(!currentPeople.length){

        alert(
            "Для " +
            place +
            " места пока нет добавленных призёров."
        );

        return;
    }

    currentIndex = 0;

    const page =
        document.getElementById(
            "winnerPage"
        );

    page.className =
        "winner-page active place-" +
        place;

    document.body.style.overflow =
        "hidden";

    /* ==============================================
       КАЖДЫЙ РАЗ СНОВА ПОКАЗЫВАЕМ GIF
    ============================================== */

    const intro =
        document.getElementById(
            "winnerIntro"
        );

    intro.classList.remove(
        "hide"
    );

    /* ==============================================
       ФЕЙЕРВЕРК ПОКА НЕ ИГРАЕТ
    ============================================== */

    const video =
        document.getElementById(
            "fireworksVideo"
        );

    try{

        video.pause();

        video.currentTime = 0;

    }
    catch(e){}

    /* ==============================================
       ПРИЗЁР ЗАРАНЕЕ ЗАГРУЖАЕТСЯ ЗА GIF
    ============================================== */

    renderWinner();
}

/* =========================================================
   НАЖАЛ НА GIF

   GIF УХОДИТ.
   ПОЯВЛЯЕТСЯ ПРИЗЁР.
   ЗАПУСКАЮТСЯ ФЕЙЕРВЕРКИ.
========================================================= */

function showWinner(){

    const intro =
        document.getElementById(
            "winnerIntro"
        );

    intro.classList.add(
        "hide"
    );

    const video =
        document.getElementById(
            "fireworksVideo"
        );

    try{

        video.currentTime = 0;

        video.play().catch(
            () => {}
        );

    }
    catch(e){}
}

/* =========================================================
   ПОКАЗ ПРИЗЁРА
========================================================= */

function renderWinner(){

    if(!currentPeople.length){
        return;
    }

    const person =
        currentPeople[
            currentIndex
        ];

    /* МЕСТО */

    document.getElementById(
        "winnerPlace"
    ).textContent =
        currentPlace +
        " место";

    /* ИМЯ */

    document.getElementById(
        "winnerName"
    ).textContent =
        person.name;

    /* ФОТО */

    document.getElementById(
        "winnerPhoto"
    ).src =
        person.photo;

    /* ДИПЛОМ */

    document.getElementById(
        "winnerDiploma"
    ).src =
        person.diploma;

    /* СЧЁТЧИК */

    document.getElementById(
        "personIndex"
    ).textContent =
        `${currentIndex + 1} / ${currentPeople.length}`;

    /* КУБОК */

    const trophy =
        document.getElementById(
            "winnerTrophy"
        );

    trophy.innerHTML =
        trophyHTML(
            currentPlace
        );

    /* НАЗАД */

    const prev =
        document.getElementById(
            "prevButton"
        );

    prev.disabled =
        currentIndex === 0;

    /* ДАЛЕЕ */

    const next =
        document.getElementById(
            "nextButton"
        );

    if(
        currentIndex ===
        currentPeople.length - 1
    ){

        next.textContent =
            "Вернуться на главную";

        next.onclick =
            goHome;

    }
    else{

        next.textContent =
            "Далее →";

        next.onclick =
            nextWinner;
    }

    const scroll =
        document.querySelector(
            ".winner-scroll"
        );

    scroll.scrollTo({
        top:0,
        behavior:"smooth"
    });
}

/* =========================================================
   СЛЕДУЮЩИЙ
========================================================= */

function nextWinner(){

    if(
        currentIndex <
        currentPeople.length - 1
    ){

        /* ПЕРЕХОДИМ К СЛЕДУЮЩЕМУ ПРИЗЁРУ */

        currentIndex++;


        /* ОСТАНАВЛИВАЕМ ФЕЙЕРВЕРК */

        const video =
            document.getElementById(
                "fireworksVideo"
            );

        try{

            video.pause();

            video.currentTime = 0;

        }
        catch(e){}


        /* ПОКАЗЫВАЕМ GIF СНОВА */

        const intro =
            document.getElementById(
                "winnerIntro"
            );

        intro.classList.remove(
            "hide"
        );


        /* ЗАРАНЕЕ МЕНЯЕМ ДАННЫЕ ПРИЗЁРА ЗА GIF */

        renderWinner();

    }

}
/* =========================================================
   ПРЕДЫДУЩИЙ
========================================================= */

function previousWinner(){

    if(currentIndex > 0){

        currentIndex--;

        renderWinner();
    }
}

/* =========================================================
   НА ГЛАВНУЮ
========================================================= */

function goHome(){

    const page =
        document.getElementById(
            "winnerPage"
        );

    page.className =
        "winner-page";

    document.body.style.overflow =
        "";

    /* СБРАСЫВАЕМ GIF */

    const intro =
        document.getElementById(
            "winnerIntro"
        );

    intro.classList.remove(
        "hide"
    );

    /* ОСТАНАВЛИВАЕМ ФЕЙЕРВЕРК */

    const video =
        document.getElementById(
            "fireworksVideo"
        );

    try{

        video.pause();

        video.currentTime = 0;

    }
    catch(e){}

    closeViewer();
}

/* =========================================================
   ОТКРЫТИЕ ДИПЛОМА
========================================================= */

function openDiploma(){

    if(!currentPeople.length){
        return;
    }

    const person =
        currentPeople[
            currentIndex
        ];

    document.getElementById(
        "viewerImage"
    ).src =
        person.diploma;

    document.getElementById(
        "viewer"
    ).classList.add(
        "active"
    );
}

/* =========================================================
   ЗАКРЫТИЕ ДИПЛОМА
========================================================= */

function closeViewer(){

    document.getElementById(
        "viewer"
    ).classList.remove(
        "active"
    );
}

/* =========================================================
   КЛАВИАТУРА
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        const viewer =
            document.getElementById(
                "viewer"
            );

        /* ==========================================
           ЕСЛИ ОТКРЫТ ДИПЛОМ
        ========================================== */

        if(
            viewer.classList.contains(
                "active"
            )
        ){

            if(
                event.key ===
                "Escape"
            ){
                closeViewer();
            }

            return;
        }

        const page =
            document.getElementById(
                "winnerPage"
            );

        if(
            !page.classList.contains(
                "active"
            )
        ){
            return;
        }

        const intro =
            document.getElementById(
                "winnerIntro"
            );

        /* ==========================================
           ЕСЛИ СЕЙЧАС GIF
        ========================================== */

        if(
            !intro.classList.contains(
                "hide"
            )
        ){

            if(
                event.key === "Enter" ||
                event.key === " " ||
                event.key === "ArrowRight"
            ){

                showWinner();
            }

            if(
                event.key ===
                "Escape"
            ){

                goHome();
            }

            return;
        }

        /* ==========================================
           СЛЕДУЮЩИЙ
        ========================================== */

        if(
            event.key ===
            "ArrowRight"
        ){

            if(
                currentIndex <
                currentPeople.length - 1
            ){

                nextWinner();
            }
        }

        /* ==========================================
           ПРЕДЫДУЩИЙ
        ========================================== */

        if(
            event.key ===
            "ArrowLeft"
        ){

            previousWinner();
        }

        /* ==========================================
           ЗАКРЫТЬ
        ========================================== */

        if(
            event.key ===
            "Escape"
        ){

            goHome();
        }

    }
);

/* =========================================================
   ЗАПУСК
========================================================= */

renderPlaces();

</script>
