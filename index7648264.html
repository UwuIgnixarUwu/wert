<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#061a35">

<title>Панорама педагогических идей — Өрлеу 2026</title>

<style>
/* =========================================================
   BASE
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --navy:#071a35;
    --navy2:#0b294d;
    --blue:#087dbd;
    --blue2:#14a7d5;
    --cyan:#56c6e3;
    --light:#e9f8ff;
    --white:#fff;

    --gold:#ffd86b;
    --gold2:#e5a82d;

    --silver:#e5edf5;
    --silver2:#9faec0;

    --bronze:#e7a875;
    --bronze2:#9b5d35;
}

html,
body{
    min-height:100%;
}

body{
    font-family:
        Inter,
        "Segoe UI",
        Arial,
        sans-serif;

    background:#f7fbfe;
    color:var(--navy);
    overflow-x:hidden;
}

button{
    font:inherit;
}

/* =========================================================
   BACKGROUND DECOR
========================================================= */

.site-bg{
    position:fixed;
    inset:0;
    z-index:-5;
    overflow:hidden;

    background:
        radial-gradient(circle at 10% 10%,rgba(37,175,221,.14),transparent 28%),
        radial-gradient(circle at 90% 30%,rgba(12,109,175,.11),transparent 30%),
        linear-gradient(145deg,#ffffff 0%,#f4fbff 55%,#edf8fd 100%);
}

.grid-pattern{
    position:absolute;
    inset:0;

    background-image:
        linear-gradient(rgba(9,72,120,.035) 1px,transparent 1px),
        linear-gradient(90deg,rgba(9,72,120,.035) 1px,transparent 1px);

    background-size:42px 42px;

    mask-image:
        linear-gradient(to bottom,black,transparent 80%);
}

.square{
    position:absolute;
    width:60px;
    height:60px;
    transform:rotate(14deg);
    opacity:.13;
}

.s1{
    background:#0b86c6;
    left:4%;
    top:15%;
}

.s2{
    background:#28b9dc;
    left:10%;
    top:23%;
    width:32px;
    height:32px;
}

.s3{
    background:#173d69;
    right:7%;
    top:13%;
    width:80px;
    height:80px;
}

.s4{
    background:#16a5d2;
    right:15%;
    top:30%;
    width:38px;
    height:38px;
}

.s5{
    background:#17416f;
    left:8%;
    bottom:12%;
    width:90px;
    height:90px;
}

.s6{
    background:#24b5d7;
    right:5%;
    bottom:9%;
    width:70px;
    height:70px;
}

/* =========================================================
   HEADER
========================================================= */

header{
    height:86px;
    padding:0 6%;

    display:flex;
    align-items:center;
    justify-content:space-between;

    position:relative;
    z-index:20;

    border-bottom:1px solid rgba(7,55,93,.08);

    background:rgba(255,255,255,.72);

    backdrop-filter:blur(18px);
}

.brand{
    display:flex;
    align-items:center;
    gap:14px;
}

.brand-symbol{
    width:46px;
    height:46px;

    position:relative;

    display:grid;
    grid-template-columns:1fr 1fr;
    gap:3px;

    transform:rotate(12deg);
}

.brand-symbol span:nth-child(1){
    background:#183e6b;
}

.brand-symbol span:nth-child(2){
    background:#48b7dd;
}

.brand-symbol span:nth-child(3){
    background:#0c87c7;
}

.brand-symbol span:nth-child(4){
    background:#82c6e7;
}

.brand-symbol span{
    border-radius:2px;
}

.brand-title{
    font-size:15px;
    font-weight:900;
    letter-spacing:.8px;
}

.brand-sub{
    margin-top:3px;
    font-size:11px;
    color:#648098;
    letter-spacing:1.2px;
    text-transform:uppercase;
}

.year{
    padding:9px 16px;

    border-radius:100px;

    color:#0d679d;

    font-size:12px;
    font-weight:800;
    letter-spacing:1.5px;

    border:1px solid rgba(14,132,190,.16);

    background:rgba(19,155,207,.07);
}

/* =========================================================
   HERO
========================================================= */

.hero{
    max-width:1250px;
    margin:auto;

    padding:75px 30px 58px;

    text-align:center;
}

.hero-label{
    display:inline-flex;
    align-items:center;
    gap:9px;

    padding:9px 16px;

    border-radius:100px;

    background:#e8f7fd;
    border:1px solid #d2eef9;

    color:#0874ac;

    font-size:12px;
    font-weight:800;
    letter-spacing:1.5px;
    text-transform:uppercase;
}

.hero-label::before{
    content:"";

    width:7px;
    height:7px;

    border-radius:50%;

    background:#12a8d4;

    box-shadow:0 0 12px #12a8d4;
}

.hero h1{
    max-width:950px;

    margin:23px auto 0;

    font-size:clamp(42px,6.4vw,84px);

    line-height:.96;

    letter-spacing:-4px;

    color:#071c37;
}

.hero h1 span{
    display:block;

    margin-top:11px;

    color:#1189bd;

    font-weight:500;
}

.hero-line{
    width:min(520px,80%);
    height:3px;

    margin:31px auto 0;

    background:
        linear-gradient(
            90deg,
            transparent,
            #13a6d3,
            #173e69,
            transparent
        );
}

.hero-description{
    margin-top:22px;

    color:#688197;

    font-size:15px;
}

/* =========================================================
   PLACES
========================================================= */

.places{
    width:min(1180px,calc(100% - 30px));

    margin:10px auto 110px;
}

/* =========================================================
   FIRST PLACE
========================================================= */

.first-place{
    min-height:270px;

    margin-bottom:20px;

    position:relative;
    overflow:hidden;

    display:flex;
    align-items:center;

    padding:45px 55px;

    border:1px solid rgba(23,99,150,.16);

    border-radius:38px;

    cursor:pointer;

    background:
        radial-gradient(circle at 80% 40%,rgba(61,196,232,.28),transparent 30%),
        linear-gradient(120deg,#071c39 0%,#0a3e69 55%,#0c83b3 130%);

    color:white;

    box-shadow:
        0 35px 90px rgba(8,52,88,.22);

    transition:.35s;
}

.first-place:hover{
    transform:translateY(-7px);

    box-shadow:
        0 45px 110px rgba(8,52,88,.3);
}

.first-place::before{
    content:"";

    position:absolute;

    width:400px;
    height:400px;

    border-radius:50%;

    right:-100px;
    top:-180px;

    border:70px solid rgba(255,255,255,.035);
}

.first-content{
    position:relative;
    z-index:3;

    flex:1;
}

.place-small{
    color:#81d8f2;

    font-size:12px;
    font-weight:800;

    letter-spacing:3px;

    text-transform:uppercase;
}

.first-number{
    margin-top:7px;

    font-size:clamp(64px,10vw,125px);

    line-height:.85;

    font-weight:950;

    letter-spacing:-7px;
}

.first-number span{
    font-size:.28em;
    letter-spacing:0;

    color:#bceafb;
}

.first-text{
    margin-top:20px;

    color:#b7d6e8;

    font-size:14px;
}

.first-arrow{
    position:absolute;

    right:35px;
    bottom:30px;

    width:48px;
    height:48px;

    border-radius:50%;

    display:grid;
    place-items:center;

    background:rgba(255,255,255,.11);

    border:1px solid rgba(255,255,255,.14);

    font-size:24px;
}

/* =========================================================
   TROPHY CSS
========================================================= */

.trophy-area{
    width:290px;

    display:flex;
    justify-content:center;

    position:relative;
    z-index:3;
}

.trophy{
    position:relative;

    width:160px;
    height:190px;

    filter:
        drop-shadow(0 25px 28px rgba(0,0,0,.28));
}

.trophy-cup{
    position:absolute;

    left:35px;
    top:5px;

    width:90px;
    height:85px;

    border-radius:
        8px 8px 45px 45px;

    background:
        linear-gradient(
            90deg,
            #bd7d15,
            #ffe89a 25%,
            #f5bd37 52%,
            #fff1ae 72%,
            #b9700d
        );
}

.trophy-cup::before,
.trophy-cup::after{
    content:"";

    position:absolute;

    top:13px;

    width:44px;
    height:48px;

    border:10px solid #e8aa2a;
}

.trophy-cup::before{
    left:-38px;

    border-right:0;

    border-radius:
        30px 0 0 30px;
}

.trophy-cup::after{
    right:-38px;

    border-left:0;

    border-radius:
        0 30px 30px 0;
}

.trophy-stem{
    position:absolute;

    left:70px;
    top:87px;

    width:20px;
    height:45px;

    background:
        linear-gradient(
            90deg,
            #b8700d,
            #ffd96b,
            #bd7711
        );
}

.trophy-base1{
    position:absolute;

    left:48px;
    top:125px;

    width:64px;
    height:17px;

    border-radius:5px;

    background:
        linear-gradient(
            90deg,
            #ad6710,
            #ffe58b,
            #b46b0d
        );
}

.trophy-base2{
    position:absolute;

    left:31px;
    top:141px;

    width:98px;
    height:27px;

    border-radius:7px;

    background:
        linear-gradient(
            90deg,
            #70410c,
            #d69522,
            #ffdc6d,
            #8c520d
        );
}

.trophy-star{
    position:absolute;

    left:62px;
    top:28px;

    z-index:5;

    color:white;

    font-size:35px;

    text-shadow:
        0 0 20px white;
}

.first-place .trophy{
    transform:scale(1.28);
}

/* =========================================================
   SECOND + THIRD
========================================================= */

.podium-row{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:20px;

    margin-bottom:20px;
}

.podium-card{
    min-height:205px;

    position:relative;
    overflow:hidden;

    display:flex;
    align-items:center;

    padding:32px;

    border-radius:30px;

    cursor:pointer;

    border:1px solid rgba(12,85,133,.12);

    background:rgba(255,255,255,.72);

    box-shadow:
        0 18px 60px rgba(19,70,104,.08);

    transition:.3s;
}

.podium-card:hover{
    transform:translateY(-5px);

    box-shadow:
        0 28px 70px rgba(19,70,104,.14);
}

.podium-card .trophy-area{
    width:180px;
}

.second .trophy{
    transform:scale(.78);
}

.second .trophy-cup,
.second .trophy-stem,
.second .trophy-base1{
    filter:grayscale(1) brightness(1.35);
}

.third .trophy{
    transform:scale(.68);
}

.third .trophy-cup,
.third .trophy-stem,
.third .trophy-base1{
    filter:
        sepia(.8)
        saturate(.8)
        brightness(.8);
}

.podium-number{
    font-size:60px;
    line-height:1;

    font-weight:950;

    letter-spacing:-4px;

    color:#092b4d;
}

.podium-number span{
    font-size:18px;

    letter-spacing:0;

    color:#5e849d;
}

.podium-info{
    margin-top:10px;

    color:#7790a3;

    font-size:13px;
}

/* =========================================================
   OTHER PLACES
========================================================= */

.other-places{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:14px;
}

.normal-place{
    min-height:125px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:25px 27px;

    border-radius:24px;

    cursor:pointer;

    border:
        1px solid rgba(12,85,133,.11);

    background:
        rgba(255,255,255,.76);

    box-shadow:
        0 12px 35px rgba(16,71,106,.055);

    transition:.25s;
}

.normal-place:hover{
    transform:translateY(-4px);

    border-color:
        rgba(11,139,194,.28);

    box-shadow:
        0 22px 55px rgba(16,71,106,.1);
}

.normal-number{
    font-size:40px;

    font-weight:900;

    letter-spacing:-2px;

    color:#0c416b;
}

.normal-number span{
    font-size:14px;

    letter-spacing:0;

    color:#7c98aa;
}

.normal-arrow{
    width:39px;
    height:39px;

    display:grid;
    place-items:center;

    border-radius:50%;

    color:#087db5;

    background:#e9f7fc;
}

/* =========================================================
   WINNER PAGE
========================================================= */

.winner-page{
    position:fixed;

    inset:0;

    z-index:1000;

    visibility:hidden;

    opacity:0;

    overflow:hidden;

    transition:.45s;

    background:
        radial-gradient(circle at 50% 0%,#135e91 0%,#071d3a 45%,#041226 100%);

    color:white;
}

.winner-page.active{
    visibility:visible;
    opacity:1;
}

/* REAL VIDEO FIREWORKS */

.fireworks-video{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    pointer-events:none;

    z-index:1;
}

/* dark overlay so content remains readable */

.winner-overlay{
    position:absolute;

    inset:0;

    z-index:2;

    background:
        radial-gradient(circle at 50% 50%,transparent 0%,rgba(1,11,26,.28) 70%),
        linear-gradient(rgba(5,22,43,.08),rgba(4,14,30,.25));
}

.winner-decor{
    position:absolute;

    inset:0;

    z-index:3;

    overflow:hidden;

    pointer-events:none;
}

.winner-square{
    position:absolute;

    width:70px;
    height:70px;

    opacity:.15;

    transform:rotate(20deg);

    background:#3bc5e7;
}

.ws1{
    left:3%;
    top:10%;
}

.ws2{
    right:5%;
    top:20%;

    background:#7dd4ec;

    width:40px;
    height:40px;
}

.ws3{
    left:9%;
    bottom:10%;

    background:#196b9e;
}

.ws4{
    right:13%;
    bottom:5%;

    width:100px;
    height:100px;
}

.winner-scroll{
    position:absolute;

    inset:0;

    z-index:10;

    overflow-y:auto;
}

.winner-content{
    width:min(1450px,calc(100% - 50px));

    min-height:100%;

    margin:auto;

    padding:30px 0 120px;
}

/* winner header */

.winner-header{
    display:flex;

    align-items:center;
    justify-content:space-between;

    margin-bottom:25px;
}

.winner-logo{
    display:flex;

    align-items:center;

    gap:12px;

    font-size:13px;

    font-weight:800;

    letter-spacing:1px;
}

.close-winner{
    height:44px;

    padding:0 17px;

    border-radius:13px;

    border:
        1px solid rgba(255,255,255,.13);

    background:
        rgba(255,255,255,.07);

    color:white;

    cursor:pointer;

    backdrop-filter:blur(12px);
}

/* winner title */

.winner-place-title{
    text-align:center;

    margin:10px 0 22px;
}

.winner-place-title .mini{
    color:#75d2ec;

    font-size:11px;

    font-weight:800;

    letter-spacing:3px;

    text-transform:uppercase;
}

.winner-place-title h2{
    margin-top:3px;

    font-size:clamp(42px,6vw,76px);

    letter-spacing:-4px;
}

/* first winner glow */

.winner-page.place-1{
    background:
        radial-gradient(circle at 50% 18%,rgba(29,153,207,.55),transparent 35%),
        radial-gradient(circle at 50% 50%,#0c3b65,#041327 75%);
}

.place-1 .winner-place-title h2{
    color:#ffe18a;

    text-shadow:
        0 0 35px rgba(255,212,99,.22);
}

/* trophy on winner */

.winner-trophy{
    height:110px;

    display:flex;

    justify-content:center;

    margin-bottom:8px;
}

.winner-trophy .trophy{
    transform:
        scale(.62)
        translateY(-55px);

    transform-origin:top center;
}

.place-1 .winner-trophy .trophy{
    transform:
        scale(.8)
        translateY(-30px);
}

/* winner main */

.winner-main{
    display:grid;

    grid-template-columns:
        minmax(300px,.72fr)
        minmax(480px,1.28fr);

    gap:34px;

    align-items:stretch;
}

.person-panel,
.diploma-panel{
    border:
        1px solid rgba(255,255,255,.12);

    background:
        rgba(255,255,255,.075);

    backdrop-filter:
        blur(22px);

    border-radius:32px;

    box-shadow:
        0 30px 80px rgba(0,0,0,.18);
}

/* person */

.person-panel{
    padding:22px;

    display:flex;

    flex-direction:column;
}

.person-photo-wrap{
    width:100%;

    flex:1;

    min-height:420px;

    position:relative;

    overflow:hidden;

    border-radius:23px;

    background:
        linear-gradient(145deg,#0d3d65,#09223e);
}

.person-photo{
    width:100%;
    height:100%;

    position:absolute;

    inset:0;

    object-fit:cover;
}

.person-photo-wrap::after{
    content:"";

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            transparent 55%,
            rgba(2,15,31,.8)
        );
}

.person-name{
    position:absolute;

    z-index:3;

    left:24px;
    right:24px;
    bottom:22px;

    font-size:clamp(24px,3vw,38px);

    font-weight:850;

    letter-spacing:-1px;

    line-height:1.05;
}

.person-index{
    margin-top:16px;

    text-align:center;

    color:#91bad1;

    font-size:12px;

    letter-spacing:1px;
}

/* diploma */

.diploma-panel{
    padding:20px;

    display:flex;

    align-items:center;
    justify-content:center;

    min-height:500px;
}

.diploma-image{
    display:block;

    max-width:100%;
    max-height:650px;

    object-fit:contain;

    border-radius:15px;

    box-shadow:
        0 20px 55px rgba(0,0,0,.28);

    cursor:zoom-in;
}

/* =========================================================
   NAVIGATION
========================================================= */

.winner-navigation{
    margin-top:25px;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:13px;
}

.nav-button{
    min-width:150px;
    height:52px;

    padding:0 22px;

    border-radius:16px;

    border:
        1px solid rgba(255,255,255,.14);

    color:white;

    background:
        rgba(255,255,255,.08);

    backdrop-filter:blur(12px);

    cursor:pointer;

    font-weight:700;

    transition:.2s;
}

.nav-button:hover{
    background:
        rgba(255,255,255,.15);
}

.nav-button.primary{
    color:#05213b;

    border:0;

    background:
        linear-gradient(
            135deg,
            #dff8ff,
            #55c4e3
        );
}

.place-1 .nav-button.primary{
    background:
        linear-gradient(
            135deg,
            #fff1b4,
            #f3bf45
        );
}

.nav-button:disabled{
    opacity:.25;

    cursor:default;
}

/* =========================================================
   IMAGE VIEWER
========================================================= */

.viewer{
    position:fixed;

    inset:0;

    z-index:5000;

    display:none;

    align-items:center;
    justify-content:center;

    padding:25px;

    background:
        rgba(0,8,20,.96);

    cursor:zoom-out;
}

.viewer.active{
    display:flex;
}

.viewer img{
    max-width:96vw;
    max-height:94vh;

    object-fit:contain;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:850px){

    header{
        height:72px;
        padding:0 18px;
    }

    .brand-title{
        font-size:12px;
    }

    .brand-sub{
        display:none;
    }

    .brand-symbol{
        width:38px;
        height:38px;
    }

    .year{
        font-size:10px;
        padding:8px 11px;
    }

    .hero{
        padding:55px 20px 38px;
    }

    .hero h1{
        letter-spacing:-2.5px;
    }

    .first-place{
        min-height:245px;

        padding:32px 25px;

        border-radius:29px;
    }

    .trophy-area{
        width:150px;
    }

    .first-place .trophy{
        transform:scale(.85);
    }

    .first-number{
        letter-spacing:-4px;
    }

    .first-text{
        max-width:180px;
    }

    .podium-row{
        grid-template-columns:1fr;
    }

    .other-places{
        grid-template-columns:
            1fr 1fr;
    }

    .winner-content{
        width:
            calc(100% - 24px);

        padding-top:15px;
    }

    .winner-main{
        grid-template-columns:1fr;
    }

    .person-photo-wrap{
        min-height:480px;
    }

    .diploma-panel{
        min-height:auto;
    }

    .winner-navigation{
        position:sticky;

        bottom:12px;

        z-index:20;
    }

    .nav-button{
        min-width:0;
        flex:1;
    }
}

@media(max-width:520px){

    .hero-label{
        font-size:9px;
    }

    .hero h1{
        font-size:42px;
    }

    .first-place{
        min-height:220px;
    }

    .trophy-area{
        position:absolute;

        right:-25px;

        opacity:.75;
    }

    .first-content{
        z-index:5;
    }

    .podium-card{
        min-height:160px;
        padding:22px;
    }

    .podium-card .trophy-area{
        width:130px;
    }

    .other-places{
        grid-template-columns:1fr;

/* =========================================================
   VARIABLES
========================================================= */

let currentPlace = 1;

let currentIndex = 0;

let currentPeople = [];


/* =========================================================
   TROPHY
========================================================= */

function trophyHTML(place){

    if(place > 3){
        return "";
    }

    let star = "★";

    if(place === 2){
        star = "Ⅱ";
    }

    if(place === 3){
        star = "Ⅲ";
    }

    return `

        <div class="trophy">

            <div class="trophy-cup"></div>

            <div class="trophy-star">
                ${star}
            </div>

            <div class="trophy-stem"></div>

            <div class="trophy-base1"></div>

            <div class="trophy-base2"></div>

        </div>

    `;

}


/* =========================================================
   FIND PLACES
========================================================= */

function getPlaces(){

    return [

        ...new Set(

            winners.map(
                person => person.place
            )

        )

    ].sort(
        (a,b) => a-b
    );

}


/* =========================================================
   RENDER HOME
========================================================= */

function renderPlaces(){

    const container =
        document.getElementById("places");


    container.innerHTML = "";


    const places =
        getPlaces();


    /* =========================
       FIRST
    ========================= */

    if(places.includes(1)){

        const first =
            document.createElement("div");


        first.className =
            "first-place";


        first.onclick =
            () => openPlace(1);


        first.innerHTML = `

            <div class="first-content">

                <div class="place-small">
                    Главное достижение
                </div>

                <div class="first-number">
                    1
                    <span>место</span>
                </div>

                <div class="first-text">
                    Открыть результаты
                </div>

            </div>


            <div class="trophy-area">

                ${trophyHTML(1)}

            </div>


            <div class="first-arrow">
                →
            </div>

        `;


        container.appendChild(
            first
        );

    }


    /* =========================
       2 + 3
    ========================= */

    const podiumPlaces =
        places.filter(
            place =>
                place === 2 ||
                place === 3
        );


    if(podiumPlaces.length){

        const row =
            document.createElement("div");


        row.className =
            "podium-row";


        podiumPlaces.forEach(place => {

            const card =
                document.createElement("div");


            card.className =
                "podium-card " +
                (
                    place === 2
                        ? "second"
                        : "third"
                );


            card.onclick =
                () => openPlace(place);


            card.innerHTML = `

                <div style="flex:1">

                    <div class="podium-number">

                        ${place}

                        <span>
                            место
                        </span>

                    </div>

                    <div class="podium-info">
                        Открыть результаты →
                    </div>

                </div>


                <div class="trophy-area">

                    ${trophyHTML(place)}

                </div>

            `;


            row.appendChild(card);

        });


        container.appendChild(row);

    }


    /* =========================
       4+
    ========================= */

    const otherPlaces =
        places.filter(
            place => place >= 4
        );


    if(otherPlaces.length){

        const grid =
            document.createElement("div");


        grid.className =
            "other-places";


        otherPlaces.forEach(place => {

            const card =
                document.createElement("div");


            card.className =
                "normal-place";


            card.onclick =
                () => openPlace(place);


            card.innerHTML = `

                <div class="normal-number">

                    ${place}

                    <span>
                        место
                    </span>

                </div>


                <div class="normal-arrow">
                    →
                </div>

            `;


            grid.appendChild(card);

        });


        container.appendChild(grid);

    }

}


/* =========================================================
   OPEN PLACE
========================================================= */

function openPlace(place){

    currentPlace =
        place;


    currentPeople =
        winners.filter(
            person =>
                person.place === place
        );


    if(!currentPeople.length){
        return;
    }


    currentIndex = 0;


    const page =
        document.getElementById(
            "winnerPage"
        );


    page.className =
        "winner-page active place-" +
        place;


    document.body.style.overflow =
        "hidden";


    /* start transparent fireworks video */

    const video =
        document.getElementById(
            "fireworksVideo"
        );


    video.currentTime = 0;


    video.play().catch(
        () => {}
    );


    renderWinner();

}


/* =========================================================
   RENDER WINNER
========================================================= */

function renderWinner(){

    const person =
        currentPeople[
            currentIndex
        ];


    document.getElementById(
        "winnerPlace"
    ).textContent =
        currentPlace +
        " место";


    document.getElementById(
        "winnerName"
    ).textContent =
        person.name;


    document.getElementById(
        "winnerPhoto"
    ).src =
        person.photo;


    document.getElementById(
        "winnerDiploma"
    ).src =
        person.diploma;


    document.getElementById(
        "personIndex"
    ).textContent =

        `${currentIndex + 1} / ${currentPeople.length}`;


    /* TROPHY */

    const trophy =
        document.getElementById(
            "winnerTrophy"
        );


    if(currentPlace <= 3){

        trophy.innerHTML =
            trophyHTML(
                currentPlace
            );

        trophy.style.display =
            "flex";

    }

    else{

        trophy.innerHTML = "";

        trophy.style.display =
            "none";

    }


    /* PREVIOUS */

    const prev =
        document.getElementById(
            "prevButton"
        );


    prev.disabled =
        currentIndex === 0;


    /* NEXT */

    const next =
        document.getElementById(
            "nextButton"
        );


    if(
        currentIndex ===
        currentPeople.length - 1
    ){

        next.textContent =
            "На главную";

        next.onclick =
            goHome;

    }

    else{

        next.textContent =
            "Далее →";

        next.onclick =
            nextWinner;

    }


    /* reset scroll */

    document.querySelector(
        ".winner-scroll"
    ).scrollTo({

        top:0,

        behavior:"smooth"

    });

}


/* =========================================================
   NEXT
========================================================= */

function nextWinner(){

    if(
        currentIndex <
        currentPeople.length - 1
    ){

        currentIndex++;

        renderWinner();

    }

}


/* =========================================================
   PREVIOUS
========================================================= */

function previousWinner(){

    if(currentIndex > 0){

        currentIndex--;

        renderWinner();

    }

}


/* =========================================================
   HOME
========================================================= */

function goHome(){

    const page =
        document.getElementById(
            "winnerPage"
        );


    page.className =
        "winner-page";


    document.body.style.overflow =
        "";


    const video =
        document.getElementById(
            "fireworksVideo"
        );


    video.pause();

}


/* =========================================================
   DIPLOMA FULLSCREEN
========================================================= */

function openDiploma(){

    const person =
        currentPeople[
            currentIndex
        ];


    document.getElementById(
        "viewerImage"
    ).src =
        person.diploma;


    document.getElementById(
        "viewer"
    ).classList.add(
        "active"
    );

}


function closeViewer(){

    document.getElementById(
        "viewer"
    ).classList.remove(
        "active"
    );

}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        const page =
            document.getElementById(
                "winnerPage"
            );


        if(
            !page.classList.contains(
                "active"
            )
        ){
            return;
        }


        if(event.key === "ArrowRight"){

            nextWinner();

        }


        if(event.key === "ArrowLeft"){

            previousWinner();

        }


        if(event.key === "Escape"){

            goHome();

        }

    }
);


/* =========================================================
   START
========================================================= */

renderPlaces();

</script>
